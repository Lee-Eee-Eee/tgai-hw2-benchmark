<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>霸王龙三步上篮</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #120e24;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }
  figure {
    margin: 0;
    padding: 16px;
    width: min(100vw, 160vh, 1180px);
    box-sizing: border-box;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
    cursor: pointer;
    user-select: none;
  }
  figcaption {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    color: #b3a9d6;
    font-size: 14px;
  }
  button {
    font: inherit;
    color: #241b4b;
    background: #ffc83d;
    border: 0;
    border-radius: 999px;
    padding: 6px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:focus-visible, svg:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* ambient loops; the dinosaur, ball and hoop are driven by the script */
  .star { animation: twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: .95; } }

  .smoke { transform-box: fill-box; transform-origin: center; animation: smoke 6s linear infinite; }
  @keyframes smoke {
    0%   { transform: translate(0, 0) scale(.5); opacity: 0; }
    15%  { opacity: .5; }
    100% { transform: translate(-50px, -100px) scale(2.3); opacity: 0; }
  }

  .ptero { animation: fly 32s linear infinite; }
  @keyframes fly { from { transform: translateX(-80px); } to { transform: translateX(1060px); } }
  .wing { transform-box: fill-box; transform-origin: center; animation: flap .9s ease-in-out infinite; }
  @keyframes flap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(-.45); } }

  .eyelid { transform-box: fill-box; transform-origin: center top; animation: blink 4.2s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(0); } 95%, 98% { transform: scaleY(1); } }

  .paused * { animation-play-state: paused !important; }
</style>
</head>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = $('scene');
  const NS = 'http://www.w3.org/2000/svg';
  const rad = Math.PI / 180, TAU = Math.PI * 2;

  // ── stage ─────────────────────────────────────────────────
  const T = 7.5;                      // loop length, seconds
  const GY = 486, FY = 480;           // floor line / height of a planted toe joint
  const RX = 800, RY = 136;           // rim centre
  const GRAV = 1080, BR = 15;         // px/s², ball radius
  const L1 = 54, L2 = 60, L3 = 40;    // thigh, shin, metatarsus
  const STEP = 0.28, V = 290;         // cruising step time and speed

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
  const f = n => n.toFixed(1);

  // keyframe track with cubic Hermite interpolation: [time, value, slope?]
  function track(keys) {
    const n = keys.length;
    const m = keys.map((k, i) => {
      if (k[2] !== undefined) return k[2];
      if (i === 0 || i === n - 1) return 0;
      return (keys[i + 1][1] - keys[i - 1][1]) / (keys[i + 1][0] - keys[i - 1][0]);
    });
    return t => {
      if (t <= keys[0][0]) return keys[0][1];
      if (t >= keys[n - 1][0]) return keys[n - 1][1];
      let i = 0;
      while (t > keys[i + 1][0]) i++;
      const h = keys[i + 1][0] - keys[i][0], s = (t - keys[i][0]) / h, s2 = s * s, s3 = s2 * s;
      return (2 * s3 - 3 * s2 + 1) * keys[i][1] + (s3 - 2 * s2 + s) * h * m[i] +
             (3 * s2 - 2 * s3) * keys[i + 1][1] + (s3 - s2) * h * m[i + 1];
    };
  }

  // ── choreography ──────────────────────────────────────────
  // 0–2.3 s dribble in · 2.28 gather · 2.68 step one (big) · 3.00 step two (small)
  // 3.30 take-off · 3.62 release · 4.06 landing · 4.9–6.3 roar · 6.95 iris out
  const X = track([[2.68, 422, V], [3.30, 550, 80], [4.06, 610.8, 80], [4.50, 622, 0], [T, 622, 0]]);
  const hipX = t => t < 2.68 ? 422 - V * (2.68 - t) : X(t);
  const H = track([[2.28, 129, 0], [2.44, 123], [2.63, 133], [2.82, 118], [3.00, 121], [3.14, 104],
                   [3.30, 150, 410], [3.68, 228, 0], [4.06, 150, -410], [4.24, 100, 0], [4.50, 120],
                   [4.85, 131], [5.30, 134], [6.30, 132], [T, 130]]);
  const hipH = t => t < 2.28 ? 126 + 3 * Math.cos(TAU * (t - 2.28) / STEP) : H(t);

  const TILT = track([[0, -5], [2.28, -6], [2.68, -9], [3.00, -14], [3.14, -20], [3.30, -30], [3.62, -37],
                      [3.80, -38], [4.06, -33], [4.24, -30], [4.60, -32], [5.00, -37], [6.30, -36], [T, -34]]);
  const NECK = track([[0, 0], [2.68, 0], [3.14, 4], [3.62, 8], [4.06, 2], [4.24, -4], [4.70, -4],
                      [5.00, -8], [6.30, -8], [6.90, -4], [T, -4]]);
  const HEAD = track([[0, 0], [2.68, 2], [3.14, 6], [3.62, 12], [4.06, -12], [4.24, -14], [4.70, -10],
                      [5.00, -18], [6.30, -18], [6.90, -8], [T, -8]]);
  const JAW = track([[0, 3], [2.40, 1], [3.30, 2], [3.62, 10], [4.00, 6], [4.24, 4], [4.78, 4],
                     [4.96, 17], [6.20, 17], [6.45, 5], [T, 4]]);
  // arm angles once the ball has been gathered (upper arm, forearm; degrees in body space)
  const A1 = track([[2.62, 48], [3.14, 62], [3.40, 6], [3.58, -8], [3.74, -14], [4.06, 30], [4.30, 66], [4.70, 20], [T, 20]]);
  const A2 = track([[2.62, -8], [3.14, 22], [3.40, -26], [3.58, -40], [3.72, 8], [4.06, 22], [4.30, 40], [4.70, -30], [T, -30]]);

  // footfalls per foot: [touch-down, lift-off, x, pose while airborne afterwards, stomp strength]
  const far = [], near = [];
  for (let k = 5; k >= 1; k--) far.push([2.28 - k * 0.56, 2.60 - k * 0.56, 350 - k * 162.4]);
  for (let k = 5; k >= 0; k--) near.push([2.00 - k * 0.56, 2.32 - k * 0.56, 269 - k * 162.4]);
  far.push([2.28, 2.58, 350],                                               // gather step
           [3.00, 3.30, 528, { dx: -28, dy: 128, beta: 22, pitch: 48 }, 2.6], // step two, then the trailing leg
           [4.10, 99, 600, null, 3]);
  near.push([2.68, 3.04, 470, { dx: 36, dy: 76, beta: -12, pitch: 30 }, 2.4], // step one, then the knee drive
            [4.06, 99, 633, null, 5]);

  // lean of the metatarsus: heel behind the toes at touch-down, raised ahead of them at push-off
  const stanceBeta = d => lerp(-28, 38, clamp((d + 45) / 95, 0, 1));

  function footAt(list, t, hx, hy, ox) {
    let i = 0;
    while (i < list.length - 1 && t >= list[i + 1][0]) i++;
    const p = list[i];
    if (t < p[1]) return { x: p[2], y: FY, beta: stanceBeta(hx - p[2]), pitch: 0 };
    const q = list[i + 1];
    const u = (t - p[1]) / (q[0] - p[1]), e = u * u * (3 - 2 * u);
    let x = lerp(p[2], q[2], e);
    let y = FY - 30 * Math.sin(Math.PI * Math.pow(u, 0.8));
    let beta = lerp(stanceBeta(hipX(p[1]) + ox - p[2]), stanceBeta(hipX(q[0]) + ox - q[2]), e) + 20 * Math.sin(Math.PI * u);
    let pitch = 46 * Math.sin(Math.PI * Math.pow(u, 0.7)) * (1 - u);
    if (p[3]) {                              // long flight: carry the foot along with the hip
      const w = smooth(0, 0.25, u) * (1 - smooth(0.75, 1, u));
      x = lerp(x, hx + p[3].dx, w); y = lerp(y, hy + p[3].dy, w);
      beta = lerp(beta, p[3].beta, w); pitch = lerp(pitch, p[3].pitch, w);
    }
    return { x, y, beta, pitch };
  }

  // hip → knee (forward) → ankle (back) → toes: two-bone IK above a leaning metatarsus
  function solveLeg(hx, hy, ft) {
    const b = ft.beta * rad, sb = Math.sin(b), cb = Math.cos(b), reach = (L1 + L2) * 0.985;
    let tx = ft.x, ty = ft.y, ax = tx + L3 * sb, ay = ty - L3 * cb;
    let dx = ax - hx, dy = ay - hy, d = Math.max(8, Math.hypot(dx, dy));
    if (d > reach) {                         // out of reach: pull the whole foot in
      dx *= reach / d; dy *= reach / d; d = reach;
      ax = hx + dx; ay = hy + dy; tx = ax - L3 * sb; ty = ay + L3 * cb;
    }
    const bend = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
    const phi = Math.atan2(dy, dx) - bend;
    return { kx: hx + L1 * Math.cos(phi), ky: hy + L1 * Math.sin(phi), ax, ay, tx, ty, d };
  }

  // tapered limb segment between two joints
  function capsule(x1, y1, r1, x2, y2, r2) {
    const a = Math.atan2(y2 - y1, x2 - x1), c = Math.cos(a), s = Math.sin(a);
    return `M${f(x1 - s * r1)} ${f(y1 + c * r1)}A${r1} ${r1} 0 0 1 ${f(x1 + s * r1)} ${f(y1 - c * r1)}` +
           `L${f(x2 + s * r2)} ${f(y2 - c * r2)}A${r2} ${r2} 0 0 1 ${f(x2 - s * r2)} ${f(y2 + c * r2)}Z`;
  }

  const el = {};
  for (const id of ['world', 'body', 'neck', 'head', 'jaw', 'mouth', 'roar', 'tail', 'tailStripes',
                    'armF', 'clawF', 'armN', 'clawN', 'armWrap', 'fThigh', 'fShin', 'fMeta', 'fFoot',
                    'nThigh', 'nShin', 'nMeta', 'nFoot', 'shadow', 'ballShadow', 'dust', 'ball', 'ballSpin',
                    'hoopBack', 'hoopFront', 'net', 'lab1', 'lab2', 'lab3', 'hit', 'plus2', 'scoreHome',
                    'meteor', 'iris']) el[id] = $(id);
  $('neckShape').setAttribute('d', capsule(0, 0, 24, 30, -46, 18));

  function drawLeg(p, hx, hy, ft) {
    const s = solveLeg(hx, hy, ft);
    el[p + 'Thigh'].setAttribute('d', capsule(hx, hy, 23, s.kx, s.ky, 13));
    el[p + 'Shin'].setAttribute('d', capsule(s.kx, s.ky, 12.5, s.ax, s.ay, 7));
    el[p + 'Meta'].setAttribute('d', capsule(s.ax, s.ay, 7, s.tx, s.ty, 6.5));
    el[p + 'Foot'].setAttribute('transform', `translate(${f(s.tx)} ${f(s.ty)}) rotate(${f(ft.pitch)})`);
    return s;
  }

  // tiny arms: shoulder → elbow → claws; (gx, gy) is where a held ball sits
  function arm(a1, a2, ox, oy) {
    const sx = 98 + ox, sy = -22 + oy;
    const ex = sx + 18 * Math.cos(a1 * rad), ey = sy + 18 * Math.sin(a1 * rad);
    const ux = Math.cos(a2 * rad), uy = Math.sin(a2 * rad);
    return { d: `M${sx} ${sy}L${f(ex)} ${f(ey)}L${f(ex + 16 * ux)} ${f(ey + 16 * uy)}`,
             hx: ex + 16 * ux, hy: ey + 16 * uy, gx: ex + 29 * ux, gy: ey + 29 * uy };
  }
  // body space (origin at the hip, x towards the snout) → scene
  const toWorld = (P, px, py) => [P.x + px * P.c - py * P.s, P.y + px * P.s + py * P.c];

  // the tail is a chain that wags and curls up as the body rears
  function drawTail(t, P) {
    const N = 12, SEG = 14.5;
    const curl = 0.6 - (P.tilt + 5) * 0.075, amp = 1.5 + 1.3 * P.cheer;
    const top = [], bot = [];
    let x = -40, y = -10, a = 184;
    for (let i = 0; i <= N; i++) {
      const k = i / N, w = 21 * Math.pow(1 - k, 0.85) + 0.6;
      const nx = -Math.sin(a * rad), ny = Math.cos(a * rad);
      top.push([x + nx * w, y + ny * w]);
      bot.push([x - nx * w, y - ny * w]);
      a += curl + amp * Math.sin(t * 11.2 - i * 0.55) * (0.35 + k);
      x += Math.cos(a * rad) * SEG; y += Math.sin(a * rad) * SEG;
    }
    const pt = p => f(p[0]) + ' ' + f(p[1]);
    let stripes = '';
    for (let i = 1; i < N - 1; i += 2) {
      const mx = (top[i][0] + top[i + 1][0] + bot[i][0] + bot[i + 1][0]) / 4;
      const my = (top[i][1] + top[i + 1][1] + bot[i][1] + bot[i + 1][1]) / 4;
      stripes += `M${pt(top[i])}L${pt(top[i + 1])}L${f(mx)} ${f(my)}Z`;
    }
    el.tailStripes.setAttribute('d', stripes);
    el.tail.setAttribute('d', 'M' + top.map(pt).join('L') + 'L' + bot.reverse().map(pt).join('L') + 'Z');
  }

  // everything about the dinosaur's pose at time t
  function pose(t) {
    const run = 1 - smooth(2.0, 2.5, t);
    const ph = TAU * (t - 2.28) / STEP;
    const roar = smooth(4.85, 5.0, t) * (1 - smooth(6.2, 6.4, t));
    const cheer = smooth(4.5, 4.8, t) * (1 - smooth(6.6, 7.0, t));
    const tilt = TILT(t) + 1.5 * Math.sin(ph + 1) * run + 0.8 * Math.sin(t * 46) * roar;
    // dribble: the ball meets the claws when up = 1 and the floor when up = 0
    const dp = (((t - 2.14) / 0.56 + 0.5) % 1 + 1) % 1;
    const up = t >= 2.42 ? 1 : Math.abs(Math.cos(Math.PI * dp));
    const hold = smooth(2.38, 2.62, t);
    const a1 = lerp(78, A1(t), hold), a2 = lerp(lerp(86, 56, up), A2(t), hold);
    const w1 = 22 * Math.sin(TAU * 4 * t), w2 = 25 * Math.sin(TAU * 4 * t + 1);
    const h = hipH(t);
    return {
      x: hipX(t), y: GY - h, h, tilt,
      c: Math.cos(tilt * rad), s: Math.sin(tilt * rad),
      neck: NECK(t),
      head: HEAD(t) + 2 * Math.sin(ph + 2.2) * run + 1.5 * Math.sin(t * 40) * roar,
      jaw: Math.max(0, JAW(t) + 1.5 * Math.sin(t * 52) * roar),
      a1: lerp(a1, -30 + w1, cheer), a2: lerp(a2, -55 + w2, cheer),
      b1: lerp(a1, -30 - w1, cheer), b2: lerp(a2, -55 - w2, cheer),
      up, hold, roar, cheer,
    };
  }

  // ── the ball ──────────────────────────────────────────────
  const TR = 3.62, TAU1 = 0.34, TB = TR + TAU1;           // release, flight to the glass, bank
  const P0 = (() => { const P = pose(TR), a = arm(P.a1, P.a2, 0, 0); return toWorld(P, a.gx, a.gy); })();
  const P1 = [RX + 21, RY - 40];                           // where it kisses the backboard
  const V1 = [(P1[0] - P0[0]) / TAU1, (P1[1] - P0[1] - 0.5 * GRAV * TAU1 * TAU1) / TAU1];
  const TAU2 = Math.sqrt(2 * (RY - P1[1]) / GRAV), TS = TB + TAU2;    // TS: through the rim
  const FLOOR = 470;
  const hops = [];                                         // ballistic hops after the net
  for (let h = { t: TS, x: RX, y: RY, vx: -30, vy: 220 }, i = 0; i < 8; i++) {
    hops.push(h);
    const d = (-h.vy + Math.sqrt(h.vy * h.vy + 2 * GRAV * (FLOOR - h.y))) / GRAV;
    const vy = -(h.vy + GRAV * d) * 0.6;
    h = { t: h.t + d, x: h.x + h.vx * d, y: FLOOR, vx: h.vx * 0.8, vy };
    if (-vy < 70 || i === 7) { h.rest = true; hops.push(h); break; }
  }

  function ballAt(t, P, grip) {
    if (t < TR) {                                          // dribbled, then carried
      const top = arm(78, 56, 0, 0), [hx, hy] = toWorld(P, top.hx, top.hy);
      const [gx, gy] = toWorld(P, grip.gx, grip.gy);
      return {
        x: lerp(hx + 5 + 7 * (1 - P.up), gx, P.hold),
        y: lerp(lerp(GY + 6 - BR, hy + BR + 3, P.up), gy, P.hold),
        sq: P.up < 0.12 ? lerp(0.78, 1, P.up / 0.12) : 1,
      };
    }
    if (t < TB) { const d = t - TR; return { x: P0[0] + V1[0] * d, y: P0[1] + V1[1] * d + 0.5 * GRAV * d * d, sq: 1 }; }
    if (t < TS) { const d = t - TB; return { x: lerp(P1[0], RX, d / TAU2), y: P1[1] + 0.5 * GRAV * d * d, sq: 1 }; }
    let i = hops.length - 1;
    while (i > 0 && t < hops[i].t) i--;
    const h = hops[i], d = t - h.t;
    if (h.rest) return { x: h.x, y: FLOOR, sq: 1 };
    return {
      x: h.x + h.vx * d,
      y: Math.min(FLOOR, h.y + h.vy * d + 0.5 * GRAV * d * d),
      sq: i > 0 && d < 0.06 ? lerp(0.8, 1, d / 0.06) : 1,
    };
  }

  const lin = keys => t => {
    let i = 0;
    while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
    return lerp(keys[i][1], keys[i + 1][1], clamp((t - keys[i][0]) / (keys[i + 1][0] - keys[i][0]), 0, 1));
  };
  const SPIN = lin([[0, 0], [2.4, 1150], [TR, 1150], [TB, 960], [TS, 900], [5.8, 560], [7.0, 440], [T, 440]]);

  // ── the net swishes for a couple of seconds after TS ──────
  function netPath(t) {
    const d = t - TS;
    let sway = 0, stretch = 0, widen = 0;
    if (d >= 0 && d < 2.4) {
      sway = -7 * Math.exp(-3.2 * d) * Math.sin(13 * d);
      stretch = 12 * Math.exp(-5 * d) * Math.abs(Math.sin(9 * d));
      widen = d < 0.2 ? 7 * Math.sin(Math.PI * d / 0.2) : 0;
    }
    const pt = (i, k) => {
      const xt = RX - 28 + i * 56 / 6, xb = RX - 16 - widen + i * (32 + 2 * widen) / 6;
      return f(lerp(xt, xb, k) + sway * k * k) + ' ' + f(RY + 3 + (41 + stretch) * k);
    };
    let s = '';
    for (let i = 0; i < 6; i++) {
      s += `M${pt(i, 0)}L${pt(i + 1, 0.33)}L${pt(i, 0.66)}L${pt(i + 1, 1)}`;
      s += `M${pt(i + 1, 0)}L${pt(i, 0.33)}L${pt(i + 1, 0.66)}L${pt(i, 1)}`;
    }
    return s + 'M' + [0, 1, 2, 3, 4, 5, 6].map(i => pt(i, 1)).join('L');
  }

  // ── footfalls: dust puffs and camera shake ────────────────
  const DUST = [[-16, -3, -22, -10], [6, -5, 16, -14], [-4, -4, -2, -20]];   // offset, then drift
  const stomps = [];
  for (const p of far.concat(near)) {
    if (p[0] < 0.2 || p[2] < -30) continue;
    const g = document.createElementNS(NS, 'g');
    for (let i = 0; i < 3; i++) g.appendChild(document.createElementNS(NS, 'circle'));
    g.setAttribute('display', 'none');
    el.dust.appendChild(g);
    stomps.push({ t: p[0], x: p[2] + 8, amp: p[4] || 1.2, g, c: [...g.children], on: false });
  }

  const f2 = n => n.toFixed(2);
  const back = k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);   // overshooting ease-out
  const labels = [[el.lab1, 2.68], [el.lab2, 3.00], [el.lab3, 3.30]];
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const idleNet = netPath(-1);
  let loops = 0, shownScore = '', netLive = true, irisOn = false;

  // ── one frame ─────────────────────────────────────────────
  function draw(t) {
    const P = pose(t);

    let shake = 0;
    for (const s of stomps) {
      const d = t - s.t, on = d >= 0 && d < 0.5;
      if (on) {
        const p = d / 0.5;
        shake += s.amp * Math.exp(-14 * d) * Math.sin(58 * d);
        s.c.forEach((c, i) => {
          c.setAttribute('cx', f(s.x + DUST[i][0] + DUST[i][2] * p));
          c.setAttribute('cy', f(GY - 2 + DUST[i][1] + DUST[i][3] * p));
          c.setAttribute('r', f(3 + (4 + s.amp) * p));
        });
        s.g.setAttribute('opacity', f2(0.55 * (1 - p)));
      }
      if (on !== s.on) { s.on = on; s.g.setAttribute('display', on ? 'inline' : 'none'); }
    }
    el.world.setAttribute('transform', `translate(0 ${f(calm ? 0 : shake)})`);

    // body, neck, head, jaw
    const bodyTf = `translate(${f(P.x)} ${f(P.y)}) rotate(${f(P.tilt)})`;
    el.body.setAttribute('transform', bodyTf);
    el.armWrap.setAttribute('transform', bodyTf);
    el.neck.setAttribute('transform', `translate(98 -50) rotate(${f(P.neck)})`);
    el.head.setAttribute('transform', `translate(30 -46) rotate(${f(P.head)})`);
    el.jaw.setAttribute('transform', `rotate(${f(P.jaw)} 8 8)`);
    const ja = P.jaw * rad;                 // lower-jaw tip closes the mouth cavity
    el.mouth.setAttribute('d', `M8 8L101 2L${f(8 + 89 * Math.cos(ja) + 2 * Math.sin(ja))} ${f(8 + 89 * Math.sin(ja) - 2 * Math.cos(ja))}Z`);
    el.roar.setAttribute('opacity', f2(P.roar * (0.6 + 0.4 * Math.sin(t * 30))));
    el.roar.setAttribute('transform', `rotate(${f(P.jaw / 2)} 8 8)`);

    // arms, tail, legs
    const an = arm(P.a1, P.a2, 0, 0), af = arm(P.b1, P.b2, 7, -3);
    el.armN.setAttribute('d', an.d);
    el.clawN.setAttribute('transform', `translate(${f(an.hx)} ${f(an.hy)}) rotate(${f(P.a2)})`);
    el.armF.setAttribute('d', af.d);
    el.clawF.setAttribute('transform', `translate(${f(af.hx)} ${f(af.hy)}) rotate(${f(P.b2)})`);
    drawTail(t, P);
    drawLeg('n', P.x, P.y, footAt(near, t, P.x, P.y, 0));
    drawLeg('f', P.x + 6, P.y - 3, footAt(far, t, P.x + 6, P.y - 3, 6));

    const lift = clamp((P.h - 132) / 96, 0, 1);
    el.shadow.setAttribute('cx', f(P.x + 14));
    el.shadow.setAttribute('rx', f(150 - 50 * lift));
    el.shadow.setAttribute('opacity', f2(0.3 - 0.14 * lift));

    // ball
    const B = ballAt(t, P, an);
    el.ball.setAttribute('transform',
      `translate(${f(B.x)} ${f(B.y + BR * (1 - B.sq))}) scale(${f2(1 + (1 - B.sq) * 0.6)} ${f2(B.sq)})`);
    el.ballSpin.setAttribute('transform', `rotate(${f(SPIN(t) % 360)})`);
    const floorY = lerp(GY + 6, FLOOR + BR, smooth(TR, TB, t));
    const high = clamp((floorY - BR - B.y) / 260, 0, 1);
    el.ballShadow.setAttribute('cx', f(B.x));
    el.ballShadow.setAttribute('cy', f(floorY));
    el.ballShadow.setAttribute('rx', f(14 - 6 * high));
    el.ballShadow.setAttribute('opacity', f2(0.32 - 0.24 * high));

    // hoop: backboard jolt and net
    const db = t - TB, dn = t - TS, live = dn >= 0 && dn < 2.4;
    const hoopTf = `translate(${f(db >= 0 && db < 0.5 ? 1.8 * Math.exp(-11 * db) * Math.sin(70 * db) : 0)} 0)`;
    el.hoopBack.setAttribute('transform', hoopTf);
    el.hoopFront.setAttribute('transform', hoopTf);
    if (live || netLive) { el.net.setAttribute('d', live ? netPath(t) : idleNet); netLive = live; }

    // step labels, bank flash, +2
    const fade = 1 - smooth(4.5, 4.9, t);
    for (const [node, at] of labels) {
      const k = (t - at) / 0.24, on = k >= 0 && fade > 0;
      node.setAttribute('opacity', on ? f2(fade) : '0');
      if (on) {
        const x = node.getAttribute('x'), sc = k < 1 ? lerp(0.3, 1, back(k)) : 1;
        node.setAttribute('transform', `translate(${x} 520) scale(${f2(sc)}) translate(${-x} -520)`);
      }
    }
    const flash = db >= 0 && db < 0.3;
    el.hit.setAttribute('opacity', flash ? f2(1 - db / 0.3) : '0');
    if (flash) el.hit.setAttribute('r', f(5 + 70 * db));
    const scored = dn >= 0 && dn < 1.3;
    el.plus2.setAttribute('opacity', scored ? f2(Math.min(1, dn / 0.1) * (1 - smooth(0.8, 1.3, dn))) : '0');
    if (scored) {
      const sc = dn < 0.25 ? lerp(0.3, 1, back(dn / 0.25)) : 1;
      const y = 100 - 44 * (1 - Math.pow(1 - dn / 1.3, 2));
      el.plus2.setAttribute('transform', `translate(800 ${f(y)}) scale(${f2(sc)}) translate(-800 -100)`);
    }

    // scoreboard, and a visitor that creeps closer every loop
    const score = String((loops * 2 + (t >= TS ? 2 : 0)) % 100).padStart(2, '0');
    if (score !== shownScore) { shownScore = score; el.scoreHome.textContent = score; }
    const pop = dn >= 0 && dn < 0.6 ? 1 + 0.4 * Math.exp(-7 * dn) : 1;
    el.scoreHome.setAttribute('transform', `translate(62 44) scale(${f2(pop)}) translate(-62 -44)`);
    const closer = Math.min(loops, 12) + t / T;
    el.meteor.setAttribute('transform',
      `translate(${f(560 - 7 * closer)} ${f(44 + 3.5 * closer)}) scale(${f2(1 + 0.09 * closer)})`);

    // iris wipe: opens on the way in, closes on the roaring head
    let R = -1, cx = 130, cy = 320;
    if (t < 0.5) R = 1150 * Math.pow(t / 0.5, 1.7);
    else if (t > 6.95) { R = 1150 * Math.pow(clamp((7.4 - t) / 0.45, 0, 1), 1.7); cx = 690; cy = 160; }
    if (R >= 0) {
      el.iris.setAttribute('cx', cx);
      el.iris.setAttribute('cy', cy);
      el.iris.setAttribute('r', f(R + 700));
    }
    if ((R >= 0) !== irisOn) { irisOn = R >= 0; el.iris.setAttribute('display', irisOn ? 'inline' : 'none'); }
  }

  // ── clock ─────────────────────────────────────────────────
  const btn = $('toggle');
  let playing = !calm, t = calm ? 3.66 : 0, last = null;

  function tick(now) {
    if (!playing) return;
    if (last !== null) t += Math.min(0.05, (now - last) / 1000);
    last = now;
    if (t >= T) { t -= T; loops++; }
    draw(t);
    requestAnimationFrame(tick);
  }

  function setPlaying(p) {
    playing = p;
    svg.classList.toggle('paused', !p);
    btn.textContent = p ? '暂停' : '播放';
    btn.setAttribute('aria-pressed', String(!p));
    if (p) { last = null; requestAnimationFrame(tick); }
  }

  btn.addEventListener('click', () => setPlaying(!playing));
  svg.addEventListener('click', () => setPlaying(!playing));
  svg.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setPlaying(!playing); }
    else if (!playing && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {   // frame-step while paused
      e.preventDefault();
      t = ((t + (e.key === 'ArrowRight' ? 0.04 : -0.04)) % T + T) % T;
      draw(t);
    }
  });

  // scrub from the console: trexLayup.seek(3.66)
  window.trexLayup = { seek(s) { t = ((s % T) + T) % T; draw(t); }, get time() { return t; } };

  draw(t);
  setPlaying(playing);
})();
</script>
</body>
</html>
