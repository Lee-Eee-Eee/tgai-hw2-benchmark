<title>T-Rex Three-Step Layup</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 28px;
    box-sizing: border-box;
    background: radial-gradient(120% 120% at 50% 0%, #1b2430 0%, #10151c 60%, #090c10 100%);
  }
  .wrap { width: min(1080px, 100%); }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 26px;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06);
  }
  @media (max-width: 640px) {
    body { padding: 12px; }
    svg { border-radius: 16px; }
  }

  svg g, svg ellipse { transform-origin: 0 0; transform-box: view-box; }

  .trexMove   { animation: trexMove 6.5s linear infinite; }
  .trexShadow { animation: shadowMove 6.5s linear infinite, shadowOp 6.5s linear infinite; }
  .thighF     { animation: thighF 6.5s ease-in-out infinite; }
  .shinF      { animation: shinF 6.5s ease-in-out infinite; }
  .thighB     { animation: thighB 6.5s ease-in-out infinite; }
  .shinB      { animation: shinB 6.5s ease-in-out infinite; }
  .armSwing   { animation: armSwing 6.5s ease-in-out infinite; }
  .jawOpen    { animation: jawOpen 6.5s ease-in-out infinite; }
  .ballHand   { animation: ballHand 6.5s linear infinite, ballHandOp 6.5s linear infinite; }
  .ballHand .ballSpin { animation: spin .55s linear infinite; }
  .ballFree   { animation: ballFree 6.5s linear infinite; }
  .ballFreeOp { animation: ballFreeOp 6.5s linear infinite; }
  .netSwish   { animation: netSwish 6.5s ease-out infinite; }
  .swishPop   { animation: swishPop 6.5s ease-out infinite; }
  .dustPuff   { animation: dustPuff 6.5s ease-out infinite; }
  .stepDust1  { animation: stepDust1 6.5s ease-out infinite; }
  .stepDust2  { animation: stepDust2 6.5s ease-out infinite; }
  .stepDust3  { animation: stepDust3 6.5s ease-out infinite; }
  .tailWag    { animation: tailWag 1.1s ease-in-out infinite; }
  .crowdSway  { animation: crowdSway 3.4s ease-in-out infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes tailWag {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(5deg); }
  }
  @keyframes crowdSway {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(4px); }
  }
