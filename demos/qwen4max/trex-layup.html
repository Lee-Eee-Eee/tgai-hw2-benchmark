<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霸王龙三步上篮</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #171d29;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #e8ecf3;
  }
  h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.06em; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; font-size: 0.85rem; color: #9aa7ba; }
  .card {
    width: min(92vw, 860px);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    line-height: 0;
  }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<h1>🦖 霸王龙三步上篮</h1>
<p class="sub">纯 SVG · SMIL 动画 · 7 秒循环 · 小短手也能扣篮（擦板）</p>
<div class="card">
<svg id="scene" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只穿23号球衣的霸王龙运球、三步上篮，球穿过篮网后弹走">
  <defs>
    <linearGradient id="arena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232f47"/>
      <stop offset="0.75" stop-color="#3d4f70"/>
      <stop offset="1" stop-color="#54688c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3955a"/>
      <stop offset="1" stop-color="#b0763d"/>
    </linearGradient>
    <radialGradient id="ballG" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#f59a4a"/>
      <stop offset="1" stop-color="#d96f22"/>
    </radialGradient>
  </defs>

  <!-- ======== arena background ======== -->
  <rect width="900" height="600" fill="url(#arena)"/>
  <text x="450" y="72" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="8" fill="#f7d154" opacity="0.9">JURASSIC HOOPS</text>
  <text x="450" y="98" text-anchor="middle" font-size="13" letter-spacing="4" fill="#aebadb">侏罗纪篮球之夜</text>

  <!-- crowd bokeh -->
  <g opacity="0.3">
    <circle cx="60" cy="330" r="9" fill="#e5484d"/><circle cx="120" cy="352" r="8" fill="#f7d154"/>
    <circle cx="185" cy="328" r="9" fill="#7fb3e8"/><circle cx="250" cy="355" r="8" fill="#9be07f"/>
    <circle cx="315" cy="332" r="9" fill="#e8a0c8"/><circle cx="380" cy="356" r="8" fill="#f7d154"/>
    <circle cx="445" cy="330" r="9" fill="#7fb3e8"/><circle cx="510" cy="354" r="8" fill="#e5484d"/>
    <circle cx="575" cy="331" r="9" fill="#9be07f"/><circle cx="640" cy="356" r="8" fill="#e8a0c8"/>
    <circle cx="705" cy="333" r="9" fill="#f7d154"/><circle cx="770" cy="352" r="8" fill="#7fb3e8"/>
    <circle cx="835" cy="330" r="9" fill="#e5484d"/><circle cx="880" cy="356" r="8" fill="#9be07f"/>
    <circle cx="90" cy="392" r="8" fill="#9be07f"/><circle cx="215" cy="396" r="8" fill="#e5484d"/>
    <circle cx="345" cy="392" r="8" fill="#f7d154"/><circle cx="475" cy="396" r="8" fill="#e8a0c8"/>
    <circle cx="605" cy="392" r="8" fill="#7fb3e8"/><circle cx="735" cy="396" r="8" fill="#9be07f"/>
    <circle cx="860" cy="392" r="8" fill="#f7d154"/>
  </g>
  <rect x="0" y="420" width="900" height="100" fill="#31405c"/>
  <rect x="0" y="416" width="900" height="6" fill="#22304a"/>

  <!-- scoreboard: flips 0 -> 2 the moment the ball swishes -->
  <g>
    <rect x="36" y="130" width="150" height="78" rx="10" fill="#101623" stroke="#3d4f70" stroke-width="2"/>
    <text x="111" y="152" text-anchor="middle" font-size="13" letter-spacing="3" fill="#aebadb">DINOS</text>
    <text x="111" y="192" text-anchor="middle" font-size="34" font-weight="700" fill="#f7d154">0
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.65" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="111" y="192" text-anchor="middle" font-size="34" font-weight="700" fill="#7fe07f" opacity="0">2
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.65" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ======== court floor ======== -->
  <rect x="0" y="520" width="900" height="80" fill="url(#floor)"/>
  <g stroke="#8a5a2b" stroke-width="2" opacity="0.5">
    <line x1="0" y1="545" x2="900" y2="545"/><line x1="0" y1="572" x2="900" y2="572"/>
    <line x1="120" y1="520" x2="100" y2="600"/><line x1="330" y1="520" x2="315" y2="600"/>
    <line x1="540" y1="520" x2="530" y2="600"/><line x1="750" y1="520" x2="745" y2="600"/>
  </g>
  <path d="M0,524 L900,524" stroke="#f4e9d8" stroke-width="3" opacity="0.8"/>
  <path d="M640,524 A120,40 0 0 0 880,524" fill="none" stroke="#f4e9d8" stroke-width="3" opacity="0.6"/>

  <!-- ======== hoop ======== -->
  <rect x="836" y="165" width="11" height="355" fill="#5a616b"/>
  <rect x="830" y="512" width="24" height="10" rx="3" fill="#3a4048"/>
  <path d="M840,172 L800,158" stroke="#5a616b" stroke-width="9" stroke-linecap="round"/>
  <rect x="790" y="138" width="12" height="128" rx="3" fill="#f4f6f8" stroke="#9aa4ae" stroke-width="2"/>
  <!-- net (back layer) -->
  <g transform="translate(766,250)">
    <g stroke="#dfe6ec" stroke-width="2" opacity="0.55" fill="none">
      <path d="M-24,0 L-11,52 M24,0 L11,52 M-12,0 L-5,52 M12,0 L5,52 M0,0 L0,52"/>
      <path d="M-24,8 L24,16 M-24,24 L24,32 M-22,40 L22,46"/>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1.05 1.18;0.97 0.94;1 1;1 1" keyTimes="0;0.615;0.645;0.675;0.71;1" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- rim -->
  <path d="M792,250 L742,250" stroke="#e8702a" stroke-width="6" stroke-linecap="round"/>
  <path d="M792,250 L790,244" stroke="#c85a1a" stroke-width="5"/>

  <!-- dust puffs: step 1, step 2, landing -->
  
  <g transform="translate(470,516)">
    <g opacity="0">
      <ellipse cx="-12" cy="0" rx="12" ry="7" fill="#e8d9b8"/>
      <ellipse cx="10" cy="-3" rx="10" ry="6" fill="#e8d9b8"/>
      <ellipse cx="0" cy="-7" rx="8" ry="5" fill="#f2e6c8"/>
      <animate attributeName="opacity" values="0;0;0.8;0.5;0;0" keyTimes="0;0.3886;0.4000;0.4314;0.4429;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -10;0 -16;0 -16;0 0" keyTimes="0;0.3886;0.4000;0.4314;0.4429;1" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <g transform="translate(550,516)">
    <g opacity="0">
      <ellipse cx="-12" cy="0" rx="12" ry="7" fill="#e8d9b8"/>
      <ellipse cx="10" cy="-3" rx="10" ry="6" fill="#e8d9b8"/>
      <ellipse cx="0" cy="-7" rx="8" ry="5" fill="#f2e6c8"/>
      <animate attributeName="opacity" values="0;0;0.8;0.5;0;0" keyTimes="0;0.4743;0.4857;0.5171;0.5286;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -10;0 -16;0 -16;0 0" keyTimes="0;0.4743;0.4857;0.5171;0.5286;1" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <g transform="translate(640,516)">
    <g opacity="0">
      <ellipse cx="-12" cy="0" rx="12" ry="7" fill="#e8d9b8"/>
      <ellipse cx="10" cy="-3" rx="10" ry="6" fill="#e8d9b8"/>
      <ellipse cx="0" cy="-7" rx="8" ry="5" fill="#f2e6c8"/>
      <animate attributeName="opacity" values="0;0;0.8;0.5;0;0" keyTimes="0;0.6600;0.6714;0.7100;0.7214;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -10;0 -16;0 -16;0 0" keyTimes="0;0.6600;0.6714;0.7100;0.7214;1" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- T-rex shadow -->
  <g>
    <ellipse cx="0" cy="527" rx="55" ry="9" fill="#000" opacity="0.25">
      <animate attributeName="rx" values="55;55;32;26;36;55;55" keyTimes="0.0000;0.4857;0.5286;0.5714;0.6143;0.6714;1.0000" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.25;0.12;0.1;0.15;0.25;0.25" keyTimes="0.0000;0.4857;0.5286;0.5714;0.6143;0.6714;1.0000" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <animateTransform attributeName="transform" type="translate" values="-180 0;380 0;470 0;550 0;620 0;640 0;1100 0;1101 0" keyTimes="0.0000;0.3143;0.4000;0.4857;0.5714;0.6714;0.9714;1.0000" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- ======== T-rex ======== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-180 0;380 0;470 0;550 0;620 0;640 0;1100 0;1101 0" keyTimes="0.0000;0.3143;0.4000;0.4857;0.5714;0.6714;0.9714;1.0000" dur="7s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -90;0 -120;0 -80;0 0;0 0" keyTimes="0.0000;0.4857;0.5286;0.5714;0.6143;0.6714;1.0000" dur="7s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.2s" repeatCount="indefinite"/>
        <g transform="translate(0,400)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0;0;8;12;6;0;0" keyTimes="0.0000;0.4857;0.5286;0.5714;0.6143;0.6714;1.0000" dur="7s" repeatCount="indefinite"/>

            <!-- tail -->
            <g>
              <path d="M-35,-18 C-95,-28 -135,-50 -168,-78 C-150,-38 -105,-2 -38,18 Z" fill="#4f9340" stroke="#33682a" stroke-width="3" stroke-linejoin="round"/>
              <animateTransform attributeName="transform" type="rotate" values="-5 -35 0;5 -35 0;-5 -35 0" dur="0.6s" repeatCount="indefinite"/>
            </g>

            <!-- far leg -->
            <g transform="translate(-10,18)">
              <g>
                <path d="M0,0 Q22,18 14,48 L-4,44 Q-10,16 0,0 Z" fill="#3f7a33" stroke="#2c5a22" stroke-width="2.5"/>
                <g transform="translate(12,46)">
                  <path d="M0,0 L8,38 L-6,40 L-6,4 Z" fill="#3f7a33" stroke="#2c5a22" stroke-width="2.5"/>
                  <path d="M-8,36 L26,40 L24,48 L-8,46 Z M22,40 L30,36 L28,44 Z" fill="#3f7a33" stroke="#2c5a22" stroke-width="2"/>
                  <animateTransform attributeName="transform" type="rotate" values="-35;20;-35" dur="0.4s" begin="-0.2s" repeatCount="indefinite"/>
                </g>
                <animateTransform attributeName="transform" type="rotate" values="28;-26;28" dur="0.4s" begin="-0.2s" repeatCount="indefinite"/>
              </g>
            </g>

            <!-- far tiny arm -->
            <g transform="translate(26,-14)">
              <g>
                <path d="M0,0 Q14,6 20,16 M18,14 L26,16 M18,16 L24,22" fill="none" stroke="#3f7a33" stroke-width="7" stroke-linecap="round"/>
                <animateTransform attributeName="transform" type="rotate" values="25;25;-70;-70;-20;25;25" keyTimes="0.0000;0.3143;0.3571;0.5571;0.6286;0.6714;1.0000" dur="7s" begin="-0.05s" repeatCount="indefinite"/>
              </g>
            </g>

            <!-- body + jersey -->
            <ellipse cx="0" cy="0" rx="62" ry="48" fill="#5aa04a" stroke="#33682a" stroke-width="3"/>
            <path d="M-46,-28 C-22,-46 24,-46 44,-24 L50,14 C22,34 -20,34 -48,12 Z" fill="#e5484d" stroke="#b32b30" stroke-width="3" stroke-linejoin="round"/>
            <text x="0" y="10" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="Arial, sans-serif">23</text>
            <circle cx="-38" cy="-34" r="4" fill="#3f7a33"/><circle cx="-20" cy="-42" r="3.5" fill="#3f7a33"/>
            <circle cx="30" cy="-38" r="4" fill="#3f7a33"/>

            <!-- near leg -->
            <g transform="translate(14,18)">
              <g>
                <path d="M0,0 Q24,18 16,48 L-4,44 Q-12,16 0,0 Z" fill="#5aa04a" stroke="#33682a" stroke-width="2.5"/>
                <g transform="translate(14,46)">
                  <path d="M0,0 L8,38 L-6,40 L-6,4 Z" fill="#5aa04a" stroke="#33682a" stroke-width="2.5"/>
                  <path d="M-8,36 L28,40 L26,48 L-8,46 Z M24,40 L34,35 L31,44 Z M14,39 L22,33 L21,42 Z" fill="#5aa04a" stroke="#33682a" stroke-width="2"/>
                  <animateTransform attributeName="transform" type="rotate" values="-35;20;-35" dur="0.4s" repeatCount="indefinite"/>
                </g>
                <animateTransform attributeName="transform" type="rotate" values="28;-26;28" dur="0.4s" repeatCount="indefinite"/>
              </g>
            </g>

            <!-- neck + head -->
            <g>
              <path d="M30,-28 C40,-45 48,-58 56,-68 L74,-52 C64,-40 56,-28 48,-16 Z" fill="#5aa04a" stroke="#33682a" stroke-width="3"/>
              <g transform="translate(56,-70)">
                <!-- lower jaw (opens for the victory roar) -->
                <g>
                  <path d="M-2,2 L58,6 L54,15 L4,12 Z" fill="#4f9340" stroke="#33682a" stroke-width="2.5" stroke-linejoin="round"/>
                  <path d="M14,6 L18,0 L22,6 M28,6 L32,1 L36,7 M42,7 L46,2 L50,7" fill="#fff" stroke="#d8d6ca" stroke-width="1"/>
                  <animateTransform attributeName="transform" type="rotate" values="0;0;20;20;0;0" keyTimes="0.0000;0.6857;0.7286;0.8571;0.9143;1.0000" dur="7s" repeatCount="indefinite"/>
                </g>
                <!-- upper skull -->
                <path d="M-12,-16 C8,-34 44,-33 62,-19 L68,-7 L60,-1 L20,1 L-8,-2 Z" fill="#5aa04a" stroke="#33682a" stroke-width="3" stroke-linejoin="round"/>
                <path d="M24,-1 L28,6 L32,-1 M36,-1 L40,6 L44,-1 M48,-1 L52,5 L56,-2" fill="#fff" stroke="#d8d6ca" stroke-width="1"/>
                <circle cx="16" cy="-17" r="6" fill="#fff" stroke="#33682a" stroke-width="1.5"/>
                <circle cx="17.5" cy="-16.5" r="3" fill="#1c2430"/>
                <circle cx="19" cy="-18.5" r="1.1" fill="#fff"/>
                <path d="M8,-26 L26,-24" stroke="#33682a" stroke-width="3" stroke-linecap="round"/>
                <circle cx="58" cy="-13" r="2.2" fill="#33682a"/>
                <animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="0.4s" repeatCount="indefinite"/>
              </g>
            </g>

            <!-- near tiny arm (the star of the show) -->
            <g transform="translate(32,-16)">
              <g>
                <path d="M0,0 Q15,6 21,17" fill="none" stroke="#5aa04a" stroke-width="8" stroke-linecap="round"/>
                <path d="M19,15 L28,17 M19,17 L26,24" fill="none" stroke="#5aa04a" stroke-width="4" stroke-linecap="round"/>
                <animateTransform attributeName="transform" type="rotate" values="25;25;-70;-70;-20;25;25" keyTimes="0.0000;0.3143;0.3571;0.5571;0.6286;0.6714;1.0000" dur="7s" repeatCount="indefinite"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ======== basketball (one motion path: dribble -> gather -> layup -> swish -> bounce -> roll) ======== -->
  <g id="ballMotion">
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear"
      path="M-120,445 L-65,504 L-11,445 L44,504 L98,445 L153,504 L207,445 L262,504 L316,445 L371,504 L425,445 L430,360 L520,355 L600,355 L640,265 L655,235 L715,195 L762,248 L762,305 L762,504 L800,430 L840,504 L872,462 L900,504 L1050,504 L1051,504"
      keyPoints="0;0.04011;0.07988;0.11999;0.15976;0.19987;0.23964;0.27975;0.31952;0.35962;0.39940;0.44173;0.48656;0.52634;0.57531;0.59199;0.62785;0.66307;0.69141;0.79037;0.83173;0.87356;0.89981;0.92491;0.99950;1.00000"
      keyTimes="0.0000;0.0286;0.0571;0.0857;0.1143;0.1429;0.1714;0.2000;0.2286;0.2571;0.2857;0.3143;0.4000;0.4857;0.5286;0.5500;0.5857;0.6214;0.6500;0.6929;0.7357;0.7786;0.8143;0.8500;0.9714;1.0000"/>
    <g>
      <circle r="16" fill="url(#ballG)" stroke="#a8521a" stroke-width="2"/>
      <path d="M-16,0 L16,0 M0,-16 L0,16 M-11,-11.5 C-3,-4 -3,4 -11,11.5 M11,-11.5 C3,-4 3,4 11,11.5" fill="none" stroke="#a8521a" stroke-width="1.8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- net (front layer, over the ball as it passes through) -->
  <g transform="translate(766,250)">
    <g stroke="#f4f7fa" stroke-width="2" opacity="0.9" fill="none">
      <path d="M-24,0 L-11,52 M24,0 L11,52 M0,0 L0,52"/>
      <path d="M-24,8 L24,16 M-24,24 L24,32 M-22,40 L22,46"/>
      <path d="M-11,52 L11,52" stroke-width="2.5"/>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1.05 1.18;0.97 0.94;1 1;1 1" keyTimes="0;0.615;0.645;0.675;0.71;1" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- +2 pop -->
  <g opacity="0">
    <text x="700" y="185" text-anchor="middle" font-size="30" font-weight="800" fill="#7fe07f" stroke="#1c4a1c" stroke-width="1">+2</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.645;0.66;0.72;0.78;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -8;0 -22;0 -30;0 0" keyTimes="0;0.645;0.66;0.72;0.78;1" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- speed lines while running -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4">
    <line x1="40" y1="430" x2="110" y2="430">
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="465" x2="95" y2="465">
      <animate attributeName="opacity" values="0.05;0.5;0.05" dur="0.3s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
</div>
<script>
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const svg = document.getElementById("scene");
    svg.setCurrentTime(4.1); // freeze at the apex of the layup
    svg.pauseAnimations();
  }
</script>
</body>
</html>
