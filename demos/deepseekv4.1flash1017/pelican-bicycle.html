<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
  :root {
    color-scheme: light;
    --ink: #173b3d;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: #f4ddba;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    isolation: isolate;
  }

  .scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  .cloud-a  { animation: cloud-drift-a 17s ease-in-out infinite alternate; }
  .cloud-b  { animation: cloud-drift-b 21s ease-in-out infinite alternate; }
  .cloud-c  { animation: cloud-drift-a 25s ease-in-out infinite alternate-reverse; }
  .sun-halo { transform-box: fill-box; transform-origin: center; animation: sun-turn 80s linear infinite; }
  .sun-rays { transform-box: view-box; transform-origin: 205px 202px; animation: sun-turn 110s linear infinite reverse; }

  .sea-dashes {
    animation: sea-slide 16s linear infinite;
  }

  .boat {
    animation: boat-rock 5.2s ease-in-out infinite alternate;
  }

  .grass-sway {
    transform-box: view-box;
    animation: grass-sway 4.4s ease-in-out infinite alternate;
  }

  .scarf-tails {
    transform-box: view-box;
    transform-origin: 638px 296px;
    animation: scarf-flutter 1.9s ease-in-out infinite alternate;
  }

  .pelican-bob {
    animation: pelican-bob 2.2s ease-in-out infinite alternate;
  }

  .head-bob {
    transform-box: view-box;
    transform-origin: 688px 252px;
    animation: head-bob 2.2s ease-in-out infinite alternate;
  }

  .shadow-pulse {
    transform-box: fill-box;
    transform-origin: center;
    animation: shadow-pulse 2.2s ease-in-out infinite alternate;
  }

  .dust-1, .dust-2, .dust-3 {
    transform-box: fill-box;
    transform-origin: center;
  }
  .dust-1 { animation: dust-puff 2.4s ease-out infinite; }
  .dust-2 { animation: dust-puff 2.4s .7s ease-out infinite; }
  .dust-3 { animation: dust-puff 2.4s 1.4s ease-out infinite; }

  .speed-1 { animation: speed-line 2.8s linear infinite; }
  .speed-2 { animation: speed-line 3.3s .8s linear infinite; }
  .speed-3 { animation: speed-line 3.9s 1.7s linear infinite; }

  .ground-dash {
    animation: ground-slide 9s linear infinite;
  }

  .scene.is-paused * {
    animation-play-state: paused !important;
  }

  /* — small playback control — */
  .playback {
    position: fixed;
    right: clamp(16px, 2.4vw, 34px);
    bottom: clamp(16px, 2.4vw, 30px);
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 40px;
    padding: 0 15px 0 12px;
    border: 1px solid rgba(23, 59, 61, .22);
    border-radius: 999px;
    background: rgba(255, 246, 228, .72);
    color: var(--ink);
    font: 600 11px/1 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    letter-spacing: .13em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    box-shadow: 0 5px 18px rgba(38, 75, 69, .08);
    transition: background .2s ease, transform .2s ease, border-color .2s ease;
  }

  .playback:hover {
    background: rgba(255, 250, 238, .95);
    border-color: rgba(23, 59, 61, .4);
    transform: translateY(-1px);
  }

  .playback:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .playback svg {
    width: 15px;
    height: 15px;
    display: block;
    flex: none;
  }

  .playback .play-icon { display: none; }
  .playback.is-paused .pause-icon { display: none; }
  .playback.is-paused .play-icon { display: block; }

  .mobile-note { display: none; }

  /* Portrait screens get a composed poster view rather than an extreme crop. */
  @media (max-aspect-ratio: 1/1) {
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(13px, 2.8vh, 24px);
      padding: 24px 12px;
      background:
        radial-gradient(circle at 50% 32%, #24504d 0%, #173b3d 48%, #102f31 100%);
    }

    .stage {
      flex: none;
      width: min(calc(100vw - 24px), calc((100vh - 250px) * 1.5), 760px);
      height: auto;
      aspect-ratio: 3 / 2;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 26px 70px rgba(6, 27, 29, .42);
    }

    .scene {
      width: 100%;
      height: 100%;
    }

    .mobile-note {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-align: center;
      color: #f8e8d0;
    }

    .mobile-note .rule {
      width: 34px;
      height: 2px;
      margin-bottom: 2px;
      border-radius: 2px;
      background: #e2674c;
    }

    .mobile-note h1 {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
      font-size: clamp(23px, 6vw, 34px);
      font-weight: 400;
      letter-spacing: -.025em;
      line-height: 1;
    }

    .mobile-note p {
      margin: 0;
      color: #d6b995;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .playback {
      position: static;
      flex: none;
      align-self: center;
      background: rgba(255, 246, 228, .94);
    }
  }

  @keyframes cloud-drift-a {
    from { transform: translateX(-8px); }
    to   { transform: translateX(13px); }
  }
  @keyframes cloud-drift-b {
    from { transform: translateX(9px); }
    to   { transform: translateX(-14px); }
  }
  @keyframes sun-turn {
    to { transform: rotate(360deg); }
  }
  @keyframes sea-slide {
    to { stroke-dashoffset: -140; }
  }
  @keyframes boat-rock {
    from { transform: translateY(-2px) rotate(-1.2deg); }
    to   { transform: translateY(4px) rotate(1.4deg); }
  }
  @keyframes grass-sway {
    from { transform: rotate(-1.2deg); }
    to   { transform: rotate(1.6deg); }
  }
  @keyframes scarf-flutter {
    from { transform: rotate(-1.8deg) translateY(1px); }
    to   { transform: rotate(2.2deg) translateY(-3px); }
  }
  @keyframes pelican-bob {
    from { transform: translateY(0); }
    to   { transform: translateY(-2.4px); }
  }
  @keyframes head-bob {
    from { transform: rotate(-0.7deg); }
    to   { transform: rotate(0.9deg); }
  }
  @keyframes shadow-pulse {
    from { transform: scaleX(1); opacity: .16; }
    to   { transform: scaleX(.965); opacity: .12; }
  }
  @keyframes dust-puff {
    0%   { opacity: 0; transform: translate(10px, 0) scale(.45); }
    18%  { opacity: .5; }
    100% { opacity: 0; transform: translate(-62px, -27px) scale(1.35); }
  }
  @keyframes speed-line {
    0%   { opacity: 0; transform: translateX(24px); }
    18%  { opacity: .55; }
    75%  { opacity: .25; }
    100% { opacity: 0; transform: translateX(-68px); }
  }
  @keyframes ground-slide {
    to { stroke-dashoffset: -260; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scene * {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
    }
    .playback { transition: none; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">

        <stop offset="1" stop-color="#ec9547"/>

    <!-- ======================= bicycle ======================= -->

          </g>

      <!-- front wheel -->
      <g transform="translate(830 620)" id="frontWheel">
        <g id="frontSpin">
          <circle r="86" fill="none" stroke="#173b3d" stroke-width="11"/>
          <circle r="86" fill="none" stroke="#efdfc5" stroke-width="2.4" stroke-dasharray="1.6 11" opacity=".36"/>
          <path d="M-83 23A86 86 0 0 1-23-83" fill="none" stroke="#396665" stroke-width="3" opacity=".55" stroke-linecap="round"/>

<script>
(() => {
  "use strict";

  const scene = document.getElementById("scene");
  const playback = document.getElementById("playback");
  const playbackLabel = document.getElementById("playbackLabel");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  const rearSpin = document.getElementById("rearSpin");
  const frontSpin = document.getElementById("frontSpin");

  const nearCrankLine = document.getElementById("nearCrankLine");
  const nearCrankFill = document.getElementById("nearCrankFill");
  const farCrankLine = document.getElementById("farCrankLine");
  const farCrankFill = document.getElementById("farCrankFill");
  const nearPedal = document.getElementById("nearPedal");
  const farPedal = document.getElementById("farPedal");
  const nearFoot = document.getElementById("nearFoot");
  const farFoot = document.getElementById("farFoot");

  const nearThighOutline = document.getElementById("nearThighOutline");
  const nearThigh = document.getElementById("nearThigh");
  const nearShinOutline = document.getElementById("nearShinOutline");
  const nearShin = document.getElementById("nearShin");
  const nearKnee = document.getElementById("nearKnee");
  const nearKneeTuft = document.getElementById("nearKneeTuft");

  const farThighOutline = document.getElementById("farThighOutline");
  const farThigh = document.getElementById("farThigh");
  const farShinOutline = document.getElementById("farShinOutline");
  const farShin = document.getElementById("farShin");
  const farKnee = document.getElementById("farKnee");

  const BB = { x: 618, y: 626 };
  const CRANK_RADIUS = 52;
  const GEAR_RATIO = 2.72;
  const CADENCE = 3.15; // radians per second

  const legs = {
    near: {
      hip: { x: 560, y: 463 },
      l1: 118,
      l2: 124,
      thighOutline: nearThighOutline,
      thigh: nearThigh,
      shinOutline: nearShinOutline,
      shin: nearShin,
      knee: nearKnee,
      tuft: nearKneeTuft,
      foot: nearFoot,
      pedal: nearPedal,
      crankLine: nearCrankLine,
      crankFill: nearCrankFill
    },
    far: {
      hip: { x: 548, y: 460 },
      l1: 118,
      l2: 124,
      thighOutline: farThighOutline,
      thigh: farThigh,
      shinOutline: farShinOutline,
      shin: farShin,
      knee: farKnee,
      tuft: null,
      foot: farFoot,
      pedal: farPedal,
      crankLine: farCrankLine,
      crankFill: farCrankFill
    }
  };

  let phase = 1.12;
  let last = performance.now();
  let paused = reduceMotion.matches;

  function solveLeg(leg, pedalPoint) {
    const target = { x: pedalPoint.x - 6, y: pedalPoint.y - 19 };
    const dx = target.x - leg.hip.x;
    const dy = target.y - leg.hip.y;
    const rawDistance = Math.hypot(dx, dy);
    const distance = Math.min(leg.l1 + leg.l2 - 0.75, Math.max(Math.abs(leg.l1 - leg.l2) + 0.75, rawDistance));
    const ux = dx / rawDistance;
    const uy = dy / rawDistance;
    const a = (leg.l1 * leg.l1 - leg.l2 * leg.l2 + distance * distance) / (2 * distance);
    const h = Math.sqrt(Math.max(0, leg.l1 * leg.l1 - a * a));
    const baseX = leg.hip.x + ux * a;
    const baseY = leg.hip.y + uy * a;

    // Choose the forward/upward knee solution.
    const kneeX = baseX + uy * h;
    const kneeY = baseY - ux * h;
    const ankleX = leg.hip.x + ux * distance;
    const ankleY = leg.hip.y + uy * distance;

    return { kneeX, kneeY, ankleX, ankleY };
  }

  function setLine(line, x1, y1, x2, y2) {
    line.setAttribute("x1", x1.toFixed(2));
    line.setAttribute("y1", y1.toFixed(2));
    line.setAttribute("x2", x2.toFixed(2));
    line.setAttribute("y2", y2.toFixed(2));
  }

  function updateLeg(leg, pedalPoint) {
    const solved = solveLeg(leg, pedalPoint);
    const { kneeX, kneeY, ankleX, ankleY } = solved;
    const hip = leg.hip;

    setLine(leg.thighOutline, hip.x, hip.y, kneeX, kneeY);
    setLine(leg.thigh, hip.x, hip.y, kneeX, kneeY);
    setLine(leg.shinOutline, kneeX, kneeY, ankleX, ankleY);
    setLine(leg.shin, kneeX, kneeY, ankleX, ankleY);
    leg.knee.setAttribute("cx", kneeX.toFixed(2));
    leg.knee.setAttribute("cy", kneeY.toFixed(2));

    if (leg.tuft) {
      const angle = Math.atan2(ankleY - kneeY, ankleX - kneeX) * 180 / Math.PI;
      leg.tuft.setAttribute("transform",
        `translate(${kneeX.toFixed(2)} ${kneeY.toFixed(2)}) rotate(${(angle + 152).toFixed(1)}) translate(${(-kneeX).toFixed(2)} ${(-kneeY).toFixed(2)})`);
    }

    leg.pedal.setAttribute("transform", `translate(${pedalPoint.x.toFixed(2)} ${pedalPoint.y.toFixed(2)})`);
    leg.foot.setAttribute("transform", `translate(${pedalPoint.x.toFixed(2)} ${(pedalPoint.y - 8).toFixed(2)})`);

    setLine(leg.crankLine, BB.x, BB.y, pedalPoint.x, pedalPoint.y);
    setLine(leg.crankFill, BB.x, BB.y, pedalPoint.x, pedalPoint.y);
  }

  function render() {
    const cos = Math.cos(phase);
    const sin = Math.sin(phase);
    const nearPedalPoint = {
      x: BB.x + cos * CRANK_RADIUS,
      y: BB.y + sin * CRANK_RADIUS
    };
    const farPedalPoint = {
      x: BB.x - cos * CRANK_RADIUS,
      y: BB.y - sin * CRANK_RADIUS
    };

    // Keep this angle continuous: wrapping the wheel angle would visibly snap
    // the spokes whenever the pedal phase passed a full revolution.
    const wheelDegrees = phase * GEAR_RATIO * 180 / Math.PI;
    rearSpin.setAttribute("transform", `rotate(${wheelDegrees.toFixed(2)})`);
    frontSpin.setAttribute("transform", `rotate(${wheelDegrees.toFixed(2)})`);

    updateLeg(legs.far, farPedalPoint);
    updateLeg(legs.near, nearPedalPoint);
  }

  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    if (!paused) {
      phase += dt * CADENCE;
      render();
    }
    requestAnimationFrame(tick);
  }

  function syncControl() {
    playback.classList.toggle("is-paused", paused);
    playback.setAttribute("aria-label", paused ? "Play animation" : "Pause animation");
    playback.title = paused ? "Play (Space)" : "Pause (Space)";
    playbackLabel.textContent = paused ? "Play" : "Pause";
    scene.classList.toggle("is-paused", paused);
  }

  function setPaused(nextPaused) {
    paused = nextPaused;
    last = performance.now();
    syncControl();
  }

  playback.addEventListener("click", () => setPaused(!paused));

  window.addEventListener("keydown", (event) => {
    if (event.code === "Space" && !event.repeat) {
      event.preventDefault();
      setPaused(!paused);
    }
  });

  reduceMotion.addEventListener?.("change", (event) => {
    if (event.matches) setPaused(true);
  });

  // A static, well-composed pose is still visible if scripting is unavailable;
  // once this runs, all three mechanisms are kept in sync.
  render();
  syncControl();
  requestAnimationFrame((now) => {
    last = now;
    requestAnimationFrame(tick);
  });
})();
</script>
</body>
</html>
