<script>
  const ride = document.getElementById('ride');
  const button = document.getElementById('playback');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  function setPlaying(playing) {
    if (playing) ride.unpauseAnimations();
    else ride.pauseAnimations();
    const label = playing ? 'Pause' : 'Play';
    button.setAttribute('aria-label', label + ' animation');
    button.querySelector('span').textContent = label;
    document.getElementById('play-symbol').toggleAttribute('hidden', playing);
    document.getElementById('pause-symbol').toggleAttribute('hidden', !playing);
  }
  setPlaying(!motion.matches);
  button.addEventListener('click', () => setPlaying(ride.animationsPaused()));
  motion.addEventListener('change', event => setPlaying(!event.matches));
</script>
