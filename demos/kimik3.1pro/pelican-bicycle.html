<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Pelican Commute — Animated SVG</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #203b43;
      --muted: #64777a;
      --paper: #f6f1e7;
      --coral: #e8785e;
      --teal: #327f7a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 48px);
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(255,255,255,.85), transparent 28%),
        radial-gradient(circle at 90% 90%, rgba(232,120,94,.08), transparent 30%),
        var(--paper);
      font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }

    main { width: min(1180px, 100%); }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 4px 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 4.5vw, 54px);
      font-weight: 500;
      letter-spacing: -.04em;
      line-height: 1;
    }

    button {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 10px 17px;
      border: 1px solid rgba(32,59,67,.16);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,255,255,.62);
      box-shadow: 0 3px 10px rgba(32,59,67,.05);
      font: 700 13px/1 inherit;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 6px 16px rgba(32,59,67,.09);
    }

    button:focus-visible { outline: 3px solid rgba(50,127,122,.35); outline-offset: 3px; }
    button svg { width: 15px; height: 15px; }

    figure {
      position: relative;
      overflow: hidden;
      margin: 0;
      border: 1px solid rgba(32,59,67,.10);
      border-radius: clamp(20px, 3vw, 34px);
      background: #dcefed;
      box-shadow: 0 24px 70px rgba(43,66,64,.13), 0 3px 10px rgba(43,66,64,.06);
    }

    .scene { display: block; width: 100%; height: auto; }

    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 13px 6px 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .02em;
    }

    figcaption span:last-child { color: #889694; }

    /* SVG animation: every moving part uses the same 1.6s pedaling clock. */
    .spokes {
      animation: spin 1.6s linear infinite;
      transform-box: view-box;
    }
    .rear-spokes { transform-origin: 390px 550px; }
    .front-spokes { transform-origin: 805px 550px; }
    .crank {
      animation: spin 1.6s linear infinite;
      transform-box: view-box;
      transform-origin: 575px 550px;
    }
    .pedal {
      animation: counter-spin 1.6s linear infinite;
      transform-box: view-box;
    }
    .pedal-a { transform-origin: 575px 505px; }
    .pedal-b { transform-origin: 575px 595px; }

    .bird-upper {
      animation: bird-bob .8s ease-in-out infinite alternate;
      transform-box: view-box;
      transform-origin: 540px 375px;
    }
    .head {
      animation: look-around 4.8s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 630px 225px;
    }
    .wing {
      animation: wing-steer 1.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 548px 278px;
    }
    .scarf-tail {
      animation: scarf-wave .8s ease-in-out infinite alternate;
      transform-box: view-box;
      transform-origin: 624px 208px;
    }
    .cloud-one { animation: cloud-drift 8s ease-in-out infinite alternate; }
    .cloud-two { animation: cloud-drift 11s ease-in-out -4s infinite alternate-reverse; }
    .cloud-three { animation: cloud-drift 9s ease-in-out -2s infinite alternate; }
    .water-lines { animation: water-slide 6s linear infinite; }
    .road-dashes { animation: road-slide 1.1s linear infinite; }
    .speed-lines { animation: speed-pulse .8s ease-in-out infinite alternate; }
    .sun-halo { animation: sun-breathe 4s ease-in-out infinite alternate; transform-origin: 970px 137px; }
    .grass-a { animation: grass-sway 2.4s ease-in-out infinite alternate; transform-origin: 135px 555px; }
    .grass-b { animation: grass-sway 3s ease-in-out -1s infinite alternate-reverse; transform-origin: 1045px 557px; }
    .chain { animation: chain-move .8s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes counter-spin { to { transform: rotate(-360deg); } }
    @keyframes bird-bob { to { transform: translateY(-5px) rotate(-.5deg); } }
    @keyframes look-around {
      0%, 42%, 100% { transform: rotate(0deg); }
      52%, 72% { transform: rotate(2.5deg) translateY(1px); }
      82% { transform: rotate(-1deg); }
    }
    @keyframes wing-steer { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-2.5deg); } }
    @keyframes scarf-wave { to { transform: rotate(5deg) scaleX(1.04); } }
    @keyframes cloud-drift { to { transform: translateX(28px) translateY(-3px); } }
    @keyframes water-slide { to { stroke-dashoffset: -120; } }
    @keyframes road-slide { to { stroke-dashoffset: 140; } }
    @keyframes speed-pulse { to { opacity: .3; transform: translateX(-9px); } }
    @keyframes sun-breathe { to { transform: scale(1.09); opacity: .65; } }
    @keyframes grass-sway { to { transform: skewX(-4deg); } }
    @keyframes chain-move { to { stroke-dashoffset: -16; } }

    .paused .scene *, .paused .scene {
      animation-play-state: paused !important;
    }

    @media (max-width: 620px) {
      body { padding: 16px; }
      header { align-items: center; }
      .eyebrow { font-size: 9px; }
      button { padding: 10px 13px; }
      button .button-label { display: none; }
      figcaption span:last-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene *, .scene { animation-play-state: paused !important; }
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">A tiny seaside animation</p>
        <h1>The Pelican Commute</h1>
      </div>
      <button id="motionToggle" type="button" aria-label="Pause animation">
        <svg id="pauseIcon" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor" />
          <rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor" />
        </svg>
        <svg id="playIcon" viewBox="0 0 16 16" aria-hidden="true" style="display:none">
          <path d="M4 2.8c0-.8.9-1.3 1.6-.9l8 5.2c.6.4.6 1.4 0 1.8l-8 5.2c-.7.4-1.6-.1-1.6-.9V2.8Z" fill="currentColor" />
        </svg>
        <span class="button-label" id="buttonLabel">Pause</span>
      </button>
    </header>

    <figure>
      <svg class="scene" id="pelicanScene" viewBox="0 0 1200 760" role="img" aria-labelledby="sceneTitle sceneDesc" xmlns="http://www.w3.org/2000/svg">
        <title id="sceneTitle">A pelican riding a teal bicycle beside the sea</title>
        <desc id="sceneDesc">A cheerful pelican with a long orange bill and a red scarf pedals a bicycle. The wheels and feet turn, the scarf flutters, and clouds drift above a coastal road.</desc>

        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cfe9e8" />
            <stop offset=".58" stop-color="#edf3df" />
            <stop offset="1" stop-color="#fae8c9" />
          </linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8fcac7" />
            <stop offset="1" stop-color="#b9d9cc" />
          </linearGradient>
          <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dbcdb5" />
            <stop offset="1" stop-color="#c9b99f" />
          </linearGradient>
          <linearGradient id="bodyFeathers" x1="0" y1="0" x2=".8" y2="1">
            <stop offset="0" stop-color="#fffdf2" />
            <stop offset="1" stop-color="#e8e4d5" />
          </linearGradient>
          <linearGradient id="billPouch" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f3a15f" />
            <stop offset="1" stop-color="#e87958" />
          </linearGradient>
          <radialGradient id="sunCore">
            <stop offset="0" stop-color="#fff6bf" />
            <stop offset="1" stop-color="#f6c96d" />
          </radialGradient>
          <filter id="softShadow" x="-30%" y="-100%" width="160%" height="300%">
            <feGaussianBlur stdDeviation="8" />
          </filter>
          <filter id="paperTexture" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="8" result="noise" />
            <feColorMatrix in="noise" type="saturate" values="0" result="gray" />
            <feComponentTransfer in="gray" result="faint">
              <feFuncA type="table" tableValues="0 .035" />
            </feComponentTransfer>
            <feBlend in="SourceGraphic" in2="faint" mode="multiply" />
          </filter>
          <clipPath id="sceneClip"><rect width="1200" height="760" rx="1" /></clipPath>
        </defs>

        <g clip-path="url(#sceneClip)" filter="url(#paperTexture)">
          <!-- Sky, sun, and drifting clouds -->
          <rect width="1200" height="760" fill="url(#sky)" />
          <circle class="sun-halo" cx="970" cy="137" r="91" fill="#fff4c1" opacity=".42" />
          <circle cx="970" cy="137" r="58" fill="url(#sunCore)" />
          <path d="M970 56v-20M970 238v-20M889 137h-20M1071 137h-20M913 80l-14-14M1041 208l-14-14M1027 80l14-14M899 208l14-14" stroke="#e6b85e" stroke-width="4" stroke-linecap="round" opacity=".55" />

          <g class="cloud-one" fill="#fffdf3" opacity=".82">
            <path d="M92 156c5-25 25-39 47-31 10-29 54-30 67 1 25-10 51 6 53 30H92Z" />
            <path d="M122 166h102" stroke="#b9d7d2" stroke-width="3" stroke-linecap="round" opacity=".45" />
          </g>
          <g class="cloud-two" fill="#fffdf3" opacity=".72">
            <path d="M398 105c4-19 22-30 40-23 12-31 59-27 65 7 24-8 44 4 49 26l-154-10Z" />
          </g>
          <g class="cloud-three" fill="#fffdf3" opacity=".7">
            <path d="M780 245c4-18 20-29 38-23 9-24 46-26 58 1 20-8 41 4 45 24l-141-2Z" />
          </g>

          <g fill="none" stroke="#6c9d9b" stroke-width="3" stroke-linecap="round" opacity=".55">
            <path d="M290 209q10-10 20 0 10-10 20 0" />
            <path d="M340 246q8-8 16 0 8-8 16 0" />
          </g>

          <!-- Distant coastline -->
          <path d="M0 347C125 326 214 346 329 323c120-24 210 7 310 0 138-11 218-38 320-17 91 19 162 4 241-2v177H0Z" fill="url(#sea)" />
          <path d="M0 347c74-52 135-55 205-21 57 27 93 17 149-2 68-23 125-15 190 4v34H0Z" fill="#88aca1" opacity=".7" />
          <path d="M772 330c81-47 145-34 209-5 67 30 136 16 219-21v55H772Z" fill="#9db8a5" opacity=".72" />
          <g class="water-lines" fill="none" stroke="#ecf4e8" stroke-width="4" stroke-linecap="round" stroke-dasharray="48 24 16 32" opacity=".8">
            <path d="M-40 382H390M445 376h360M860 390h390" />
            <path d="M40 421h290M385 411h370M806 430h330" />
            <path d="M-20 457h230M288 446h400M765 465h390" />
          </g>
          <path d="M0 471c140-25 245-9 370 12 137 23 265-28 415-19 145 9 258 43 415 5v157H0Z" fill="#e6d9b9" />
          <path d="M0 500c180-30 280 41 449 20 197-25 321-34 479 2 99 22 178 10 272-6v109H0Z" fill="#d6d0a9" opacity=".75" />

          <!-- Coastal plants -->
          <g class="grass-a" stroke="#698a70" stroke-width="6" stroke-linecap="round" fill="none">
            <path d="M133 563q-4-69-39-93M135 561q18-76 53-97M133 560q-33-44-68-47M137 560q3-53 2-91" />
            <path d="M100 478l-16-6M184 470l14-12M137 493l12-17" stroke-width="4" />
          </g>
          <g fill="#d09a58" opacity=".9">
            <ellipse cx="94" cy="467" rx="7" ry="16" transform="rotate(-38 94 467)" />
            <ellipse cx="190" cy="461" rx="7" ry="17" transform="rotate(34 190 461)" />
          </g>
          <g class="grass-b" stroke="#789175" stroke-width="6" stroke-linecap="round" fill="none">
            <path d="M1045 570q-4-77-34-115M1047 570q16-70 56-101M1044 568q-25-48-64-57M1047 569q2-51 7-92" />
          </g>
          <g fill="#e9a181" opacity=".85">
            <circle cx="1098" cy="475" r="8" /><circle cx="1109" cy="468" r="6" /><circle cx="1104" cy="482" r="6" />
          </g>

          <!-- Road and rolling speed marks -->
          <path d="M0 595c218-24 373 7 584 2 233-6 385-29 616-4v167H0Z" fill="url(#road)" />
          <path d="M0 595c218-24 373 7 584 2 233-6 385-29 616-4" fill="none" stroke="#f5e7ca" stroke-width="8" />
          <path class="road-dashes" d="M-100 705H1300" fill="none" stroke="#f5e9d2" stroke-width="8" stroke-linecap="round" stroke-dasharray="88 52" opacity=".9" />
          <g fill="none" stroke="#9b8d77" stroke-width="3" stroke-linecap="round" opacity=".35">
            <path d="M91 651h42M1010 642h54M930 726h31M191 741h64" />
          </g>

          <ellipse cx="604" cy="661" rx="340" ry="20" fill="#596f66" opacity=".18" filter="url(#softShadow)" />
          <g class="speed-lines" fill="none" stroke="#7c9b92" stroke-width="5" stroke-linecap="round" opacity=".65">
            <path d="M192 454h91M159 481h75M222 510h48" />
          </g>

          <!-- Bicycle wheels -->
          <g fill="none">
            <circle cx="390" cy="550" r="112" stroke="#263f46" stroke-width="14" />
            <circle cx="390" cy="550" r="101" stroke="#f8f0dc" stroke-width="3" />
            <circle cx="805" cy="550" r="112" stroke="#263f46" stroke-width="14" />
            <circle cx="805" cy="550" r="101" stroke="#f8f0dc" stroke-width="3" />
          </g>

          <g class="spokes rear-spokes" stroke="#718482" stroke-width="2.2" opacity=".82">
            <path d="M390 452v196M292 550h196M320.9 480.9l138.2 138.2M320.9 619.1l138.2-138.2M341 465.5l98 169M305 501.5l170 98M305 598.5l170-98M341 634.5l98-169" />
            <circle cx="390" cy="550" r="10" fill="#f4c06f" stroke="#263f46" stroke-width="4" />
          </g>
          <g class="spokes front-spokes" stroke="#718482" stroke-width="2.2" opacity=".82">
            <path d="M805 452v196M707 550h196M735.9 480.9l138.2 138.2M735.9 619.1l138.2-138.2M756 465.5l98 169M720 501.5l170 98M720 598.5l170-98M756 634.5l98-169" />
            <circle cx="805" cy="550" r="10" fill="#f4c06f" stroke="#263f46" stroke-width="4" />
          </g>

          <!-- Coral fenders -->
          <path d="M297 500a108 108 0 0 1 186-18" fill="none" stroke="#df745c" stroke-width="8" stroke-linecap="round" />
          <path d="M715 497a108 108 0 0 1 180-3" fill="none" stroke="#df745c" stroke-width="8" stroke-linecap="round" />

          <!-- Back pedaling leg; its endpoint follows the opposite pedal. -->
          <path id="backLeg" d="M500 382Q490 440 543 518" fill="none" stroke="#d98a48" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
            <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear"
              values="M500 382Q490 440 543 518;M500 382Q505 540 543 582;M500 382Q485 500 530 550;M500 382Q550 540 575 595;M500 382Q590 500 607 582;M500 382Q590 450 620 550;M500 382Q570 425 607 518;M500 382Q528 440 575 505;M500 382Q490 440 543 518" />
          </path>

          <!-- Frame, chain, seat and handlebars -->
          <g fill="none" stroke="#327f7a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
            <path d="M390 550 486 394 575 550Z" />
            <path d="M486 394 710 420 575 550 710 420 805 550" />
          </g>
          <path d="M392 542 486 398 568 539M493 402l207 24" fill="none" stroke="#68aaa0" stroke-width="3" stroke-linecap="round" opacity=".8" />
          <path class="chain" d="M390 535 575 520M390 565 575 580" fill="none" stroke="#4c5b58" stroke-width="4" stroke-dasharray="7 5" />
          <circle cx="575" cy="550" r="31" fill="#f0d7a0" stroke="#355f5d" stroke-width="6" />
          <circle cx="575" cy="550" r="19" fill="none" stroke="#c29559" stroke-width="3" stroke-dasharray="4 5" />
          <path d="M486 395 474 367" stroke="#355f5d" stroke-width="10" stroke-linecap="round" />
          <path d="M439 367q42-15 88 1" fill="none" stroke="#263f46" stroke-width="16" stroke-linecap="round" />
          <path d="M710 420 744 354 775 348" fill="none" stroke="#355f5d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M752 338q22 19 45 3" fill="none" stroke="#263f46" stroke-width="9" stroke-linecap="round" />
          <path d="M791 342h16" stroke="#df745c" stroke-width="12" stroke-linecap="round" />
          <circle cx="727" cy="410" r="12" fill="#f6cd72" stroke="#355f5d" stroke-width="4" />
          <path d="M742 406l20-6" stroke="#f6cd72" stroke-width="4" stroke-linecap="round" opacity=".7" />

          <!-- Front leg, synchronized with the top pedal. -->
          <path id="frontLeg" d="M512 382Q540 440 575 505" fill="none" stroke="#efa552" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
            <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear"
              values="M512 382Q540 440 575 505;M512 382Q580 425 607 518;M512 382Q600 450 620 550;M512 382Q600 500 607 582;M512 382Q562 540 575 595;M512 382Q517 540 543 582;M512 382Q497 500 530 550;M512 382Q502 440 543 518;M512 382Q540 440 575 505" />
          </path>

          <!-- Crank arms rotate; nested pedals counter-rotate to keep feet level. -->
          <g class="crank">
            <path d="M575 505v90" stroke="#263f46" stroke-width="8" stroke-linecap="round" />
            <g class="pedal pedal-a">
              <path d="M558 513h37" stroke="#263f46" stroke-width="7" stroke-linecap="round" />
              <path d="M557 498q15-12 29 0l17 5q7 8-6 10l-22-4-17 3q-12-4-1-14Z" fill="#efa552" stroke="#a96339" stroke-width="2.5" stroke-linejoin="round" />
              <path d="M581 502l-3 8M589 504l-3 7" stroke="#a96339" stroke-width="2" stroke-linecap="round" />
            </g>
            <g class="pedal pedal-b">
              <path d="M555 603h38" stroke="#263f46" stroke-width="7" stroke-linecap="round" />
              <path d="M555 588q15-12 29 0l17 5q7 8-6 10l-22-4-17 3q-12-4-1-14Z" fill="#d98a48" stroke="#a96339" stroke-width="2.5" stroke-linejoin="round" />
              <path d="M579 592l-3 8M587 594l-3 7" stroke="#a96339" stroke-width="2" stroke-linecap="round" />
            </g>
            <circle cx="575" cy="550" r="8" fill="#263f46" />
          </g>

          <!-- Pelican: body, scarf, neck, head, and steering wing -->
          <g class="bird-upper">
            <g class="scarf-tail">
              <path d="M631 209c-38-26-74-24-111-49 11 28 29 48 65 57-32 2-53 16-72 35 49 2 85-4 121-23Z" fill="#df6b57" stroke="#a94e44" stroke-width="3" stroke-linejoin="round" />
              <path d="M536 173q34 34 78 44M538 239q39-4 71-18" fill="none" stroke="#f6a07d" stroke-width="4" stroke-linecap="round" opacity=".75" />
              <path d="M520 160l-8-12M529 166l-3-14M514 251l-10 6M526 246l-5 12" stroke="#a94e44" stroke-width="3" stroke-linecap="round" />
            </g>

            <!-- Tail and body -->
            <path d="M466 321 369 286l54 53-73 3 94 45Z" fill="#d8ddd3" stroke="#526c6c" stroke-width="4" stroke-linejoin="round" />
            <path d="M448 329c0-70 58-105 127-85 61 17 79 68 54 116-25 49-99 67-155 34-20-12-29-35-26-65Z" fill="url(#bodyFeathers)" stroke="#526c6c" stroke-width="4" />
            <path d="M463 354c32 45 103 48 150 11-31 47-103 59-146 25-12-10-16-23-17-36Z" fill="#d9dfd5" opacity=".8" />
            <path d="M453 308q-15 36 2 65M470 289q-9 19-8 36" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".75" />

            <!-- S-shaped neck -->
            <path d="M567 294c42-22 35-65 45-99 12-42 42-63 78-51 23 8 29 31 15 50-18-13-42-4-50 21-13 41 20 79-17 112-22 19-52 12-71-1Z" fill="url(#bodyFeathers)" stroke="#526c6c" stroke-width="4" stroke-linejoin="round" />
            <path d="M622 278c20-27 4-60 18-91" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".65" />

            <!-- Scarf collar -->
            <path d="M611 207q27 15 55 3l9 22q-34 19-67-1Z" fill="#df6b57" stroke="#a94e44" stroke-width="3" />
            <path d="M619 215q19 9 38 4" fill="none" stroke="#f6a07d" stroke-width="3" stroke-linecap="round" />

            <g class="head">
              <!-- Crest -->
              <path d="M659 126q-21-28-40-19 17 7 24 26-29-18-39-3 23 1 38 17" fill="#f5f2e5" stroke="#526c6c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M652 166c0-34 24-57 56-52 31 4 48 31 38 61-9 28-39 42-67 28-17-8-27-20-27-37Z" fill="#fffdf2" stroke="#526c6c" stroke-width="4" />
              <path d="M660 155q7-27 32-33" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" />

  <script>
    const scene = document.getElementById('pelicanScene');
    const toggle = document.getElementById('motionToggle');
    const pauseIcon = document.getElementById('pauseIcon');
    const playIcon = document.getElementById('playIcon');
    const label = document.getElementById('buttonLabel');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paused = false;

    function renderMotionState() {
      document.body.classList.toggle('paused', paused);
      if (paused) scene.pauseAnimations();
      else scene.unpauseAnimations();
      toggle.setAttribute('aria-label', paused ? 'Play animation' : 'Pause animation');
      label.textContent = paused ? 'Play' : 'Pause';
      pauseIcon.style.display = paused ? 'none' : '';
      playIcon.style.display = paused ? '' : 'none';
    }

    toggle.addEventListener('click', () => {
      paused = !paused;
      renderMotionState();
    });

    if (reducedMotion.matches) {
      paused = true;
      renderMotionState();
    }
  </script>
