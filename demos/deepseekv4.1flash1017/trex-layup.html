<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123a3a">
<title>霸王龙三步上篮 · T-Rex Layup</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #123a3a;
    --cream: #f8ecd4;
    --coral: #e56846;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: #102f31;
    color: var(--cream);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    isolation: isolate;
  }

  .scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  .pennant-cloth {
    transform-box: fill-box;
    transform-origin: 50% 0;
    animation: pennant-sway 4.6s ease-in-out infinite alternate;
  }
  .pennant-b { animation-duration: 5.8s; animation-delay: -1.4s; }
  .pennant-c { animation-duration: 4.1s; animation-delay: -2.1s; }

  .light-pulse {
    animation: light-pulse 5.5s ease-in-out infinite alternate;
  }

  .scene.is-paused * {
    animation-play-state: paused !important;
  }

  /* — playback control — */
  .playback {
    position: fixed;
    right: clamp(16px, 2.4vw, 34px);
    bottom: clamp(16px, 2.4vw, 30px);
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 40px;
    padding: 0 15px 0 12px;
    border: 1px solid rgba(248, 236, 212, .24);
    border-radius: 999px;
    background: rgba(11, 40, 41, .66);
    color: var(--cream);
    font: 600 11px/1 "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    letter-spacing: .14em;
    cursor: pointer;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 22px rgba(0, 0, 0, .16);
    transition: background .2s ease, transform .2s ease, border-color .2s ease;
  }

  .playback:hover {
    background: rgba(20, 61, 60, .92);
    border-color: rgba(248, 236, 212, .55);
    transform: translateY(-1px);
  }

  .playback:focus-visible {
    outline: 2px solid var(--cream);
    outline-offset: 3px;
  }

  .playback svg {
    width: 15px;
    height: 15px;
    display: block;
    flex: none;
  }

  .playback .play-icon { display: none; }
  .playback.is-paused .pause-icon { display: none; }
  .playback.is-paused .play-icon { display: block; }

  .mobile-note { display: none; }

  .desktop-caption {
    position: fixed;
    left: clamp(20px, 3.6vw, 52px);
    bottom: clamp(20px, 3.2vw, 36px);
    z-index: 9;
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--cream);
    pointer-events: none;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .22);
  }

  .desktop-caption .caption-rule {
    width: 32px;
    height: 2px;
    margin-bottom: 2px;
    background: var(--coral);
    border-radius: 2px;
  }

  .desktop-caption .caption-title {
    margin: 0;
    font-size: clamp(20px, 2.2vw, 30px);
    font-weight: 800;
    letter-spacing: .06em;
    line-height: 1.05;
  }

  .desktop-caption .caption-sub {
    margin: 0;
    color: #d4b795;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  @media (max-aspect-ratio: 1/1) {
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(13px, 2.8vh, 24px);
      padding: 24px 12px;
      background:
        radial-gradient(circle at 50% 30%, #1e514b 0%, #123a3a 48%, #0a282a 100%);
    }

    .stage {
      flex: none;
      width: min(calc(100vw - 24px), calc((100vh - 250px) * 1.5), 760px);
      height: auto;
      aspect-ratio: 3 / 2;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 26px 70px rgba(0, 0, 0, .42);
    }

    .scene { width: 100%; height: 100%; }

    .mobile-note {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-align: center;
      color: var(--cream);
    }

    .desktop-caption { display: none; }

    .mobile-note .rule {
      width: 34px;
      height: 2px;
      margin-bottom: 2px;
      border-radius: 2px;
      background: var(--coral);
    }

    .mobile-note h1 {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: clamp(23px, 6vw, 34px);
      font-weight: 800;
      letter-spacing: .04em;
      line-height: 1.05;
    }

    .mobile-note p {
      margin: 0;
      color: #c8a987;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .playback {
      position: static;
      flex: none;
      align-self: center;
      background: rgba(18, 58, 58, .9);
    }
  }

  @keyframes pennant-sway {
    from { transform: rotate(-1.4deg) skewX(1deg); }
    to   { transform: rotate(1.8deg) skewX(-1deg); }
  }

  @keyframes light-pulse {
    from { opacity: .42; }
    to   { opacity: .74; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scene * {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
    }
    .playback { transition: none; }
  }
</style>
</head>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const scene = $("scene");
  const playback = $("playback");
  const playbackLabel = $("playbackLabel");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  const LOOP = 5.8;

  const SCORE_TIME = 3.24;

  const RIM = { x: 1020, y: 318 };
  const THIGH = 92;

  const TAU = Math.PI * 2;

  const trex = $("trex");
  const tail = $("tail");

  const jaw = $("jaw");

  const stepDots = [$("stepDot1"), $("stepDot2"), $("stepDot3")];
  const stepTexts = [$("stepText1"), $("stepText2"), $("stepText3")];
  const trexShadow = $("trexShadow");
  const ballShadow = $("ballShadow");

  const ball = $("ball");
  const ballTrail = $("ballTrail");
  const trailDots = [$("trail1"), $("trail2"), $("trail3")];
  const gripClaws = $("gripClaws");
  const netMesh = $("netMesh");
  const actLayer = $("actLayer");
  const footprints = [$("print1"), $("print2"), $("print3")];
  const dust = $("dust");
  const confetti = $("confetti");

  const legs = {
    near: {
      hip: { x: 32, y: 12 },
      root: $("legNear"),
      thigh: $("legNearThigh"),
      shin: $("legNearShin"),
      foot: $("legNearFoot")
    },
    far: {
      hip: { x: -18, y: 8 },
      root: $("legFar"),
      thigh: $("legFarThigh"),
      shin: $("legFarShin"),
      foot: $("legFarFoot")
    }
  };

  const arms = {
    near: {
      shoulder: { x: 144, y: -120 },
      outline: $("armNearOutline"),
      fill: $("armNearFill"),
      hand: $("handNear")
    },
    far: {
      shoulder: { x: 128, y: -128 },
      outline: $("armFarOutline"),
      fill: $("armFarFill"),
      hand: $("handFar")
    }
  };

  let paused = reduceMotion.matches;
  let virtualTime = reduceMotion.matches ? 2.72 : 0;
  let lastFrame = performance.now();
  let lastScore = null;
  let lastPhase = null;
  let stepLit = [false, false, false];

  // ---------- math helpers ----------
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const smoothstep = (u) => u * u * (3 - 2 * u);
  const smooth = (u) => smoothstep(clamp(u, 0, 1));

  function track(t, keys, ease = smooth) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const [t0, v0] = keys[i - 1];
        const [t1, v1] = keys[i];
        const u = ease((t - t0) / Math.max(0.0001, t1 - t0));
        return lerp(v0, v1, u);
      }
    }
    return keys[keys.length - 1][1];
  }

  function deg(rad) { return rad * 180 / Math.PI; }

  function pointTrack(t, keys, ease = smooth) {
    if (t <= keys[0][0]) return { x: keys[0][1], y: keys[0][2] };
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const [t0, x0, y0] = keys[i - 1];
        const [t1, x1, y1] = keys[i];
        const u = ease((t - t0) / Math.max(0.0001, t1 - t0));
        return { x: lerp(x0, x1, u), y: lerp(y0, y1, u) };
      }
    }
    const lastKey = keys[keys.length - 1];
    return { x: lastKey[1], y: lastKey[2] };
  }

  // ---------- roooot motion ----------
  function getRoot(t) {
    let x = track(t, [
      [0, 360], [0.95, 360], [1.15, 400], [1.55, 460],
      [1.95, 505], [2.15, 535], [2.55, 580], [2.85, 580],
      [3.30, 590], [3.7, 590], [5.8, 590]
    ]);

    let y;
    if (t >= JUMP_START && t <= JUMP_END) {
      const u = (t - JUMP_START) / (JUMP_END - JUMP_START);
      y = 514 - 110 * 4 * u * (1 - u);
    } else {
      y = track(t, [
        [0, 500], [0.9, 500], [1.15, 500], [1.55, 500],
        [1.95, 501], [2.15, 514], [3.30, 514], [3.56, 500],
        [3.80, 500], [3.98, 486], [4.12, 500], [4.28, 490],
        [4.45, 500], [4.75, 500], [5.8, 500]
      ]);
    }
    return { x, y };
  }

  // ---------- foot targets ----------
  function planted(worldX, root) {
    return {
      x: worldX - root.x,
      y: GROUND_ANKLE - root.y,
      footAngle: 0,
      planted: true
    };
  }

  function swing(fromX, toX, u, lift, root) {
    const s = smooth(u);
    return {
      x: lerp(fromX - root.x, toX - root.x, s),
      y: GROUND_ANKLE - root.y - Math.sin(Math.PI * s) * lift,
      footAngle: -24 * Math.sin(Math.PI * s),
      planted: false
    };
  }

  function airborne(t, which) {
    const near = which === "near";
    const xKeys = near
      ? [[JUMP_START, 20], [2.5, 112], [2.8, 125], [3.12, 85], [JUMP_END, 70]]
      : [[JUMP_START, -35], [2.5, -70], [2.8, -88], [3.12, -60], [JUMP_END, -55]];
    const yKeys = near
      ? [[JUMP_START, 122], [2.5, 75], [2.8, 84], [3.12, 108], [JUMP_END, 122]]
      : [[JUMP_START, 122], [2.5, 112], [2.8, 112], [3.12, 115], [JUMP_END, 122]];
    const angleKeys = [[JUMP_START, 0], [2.36, 20], [2.76, 15], [3.05, -5], [JUMP_END, 0]];
    return {
      x: track(t, xKeys),
      y: track(t, yKeys),
      footAngle: track(t, angleKeys),
      planted: false
    };
  }

  function getLegTarget(which, t, root) {
    if (which === "near") {
      if (t < 0.95) return planted(425, root);
      if (t < 1.15) return swing(425, 455, (t - 0.95) / 0.20, 55, root);
      if (t < 1.55) return planted(455, root);
      if (t < 1.95) return swing(455, 555, (t - 1.55) / 0.40, 66, root);
      if (t < 2.15) return planted(555, root);
      if (t < JUMP_END) return airborne(t, "near");
      return planted(660, root);
    }
    if (t < 1.15) return planted(335, root);
    if (t < 1.55) return swing(335, 505, (t - 1.15) / 0.40, 76, root);
    if (t < 2.15) return planted(505, root);
    if (t < JUMP_END) return airborne(t, "far");
    return planted(535, root);
  }

  function solveLeg(leg, target) {
    const dx = target.x - leg.hip.x;
    const dy = target.y - leg.hip.y;
    const raw = Math.hypot(dx, dy);
    const d = clamp(raw, Math.abs(THIGH - SHIN) + 1, THIGH + SHIN - 1);
    const ux = dx / (raw || 1);
    const uy = dy / (raw || 1);
    const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
    const knee = {
      x: leg.hip.x + ux * a + uy * h,
      y: leg.hip.y + uy * a - ux * h
    };
    const ankle = {
      x: leg.hip.x + ux * d,
      y: leg.hip.y + uy * d
    };
    return { knee, ankle };
  }

  function placeLeg(leg, target) {
    const solved = solveLeg(leg, target);
    const thighAbs = Math.atan2(solved.knee.x - leg.hip.x, solved.knee.y - leg.hip.y);
    const shinAbs = Math.atan2(solved.ankle.x - solved.knee.x, solved.ankle.y - solved.knee.y);
    const footAbs = target.footAngle * Math.PI / 180;
    leg.thigh.setAttribute("transform", `rotate(${deg(thighAbs).toFixed(2)} 0 0)`);
    leg.shin.setAttribute("transform", `rotate(${deg(shinAbs - thighAbs).toFixed(2)} 0 0)`);
    leg.foot.setAttribute("transform", `rotate(${deg(footAbs - shinAbs).toFixed(2)} 0 0)`);
  }

  // ---------- ball ----------
  function getHoldLocal(t) {
    return pointTrack(t, [
      [0.90, 230, -75],
      [1.15, 236, -80],
      [1.55, 240, -84],
      [1.95, 244, -88],
      [2.15, 242, -86],
      [2.45, 270, -98],
      [2.65, 330, -112],
      [2.82, 365, -122]
    ]);
  }

  function getBallState(t, root) {
    let x, y, held = false, visible = true, spinT = t;

    if (t < 0.90) {
      const u = smooth((t - 0.16) / 0.68);
      const handX = root.x + 234;
      const handY = root.y - 58;
      const floorY = 634;
      x = handX + 15 * Math.sin(Math.PI * u);
      y = handY + (floorY - handY) * Math.sin(Math.PI * u);
      spinT = t * 2;
    } else if (t < RELEASE_TIME) {
      const hold = getHoldLocal(t);
      x = root.x + hold.x;
      y = root.y + hold.y;
      held = true;
      spinT = t * 1.5;
    } else if (t < SCORE_TIME) {
      const u = clamp((t - RELEASE_TIME) / (SCORE_TIME - RELEASE_TIME), 0, 1);
      const p0 = (() => {
        const r0 = getRoot(RELEASE_TIME);
        const h0 = getHoldLocal(RELEASE_TIME);
        return { x: r0.x + h0.x, y: r0.y + h0.y };
      })();
      const p1 = { x: 970, y: 244 };
      const p2 = { x: 1010, y: 265 };
      const p3 = { x: RIM.x, y: RIM.y };
      const v = 1 - u;
      x = v * v * v * p0.x + 3 * v * v * u * p1.x + 3 * v * u * u * p2.x + u * u * u * p3.x;
      y = v * v * v * p0.y + 3 * v * v * u * p1.y + 3 * v * u * u * p2.y + u * u * u * p3.y;
      spinT = t * 5.5;
    } else {
      const dt = t - SCORE_TIME;
      if (dt < 0.30) {
        x = RIM.x + 2 * Math.sin(dt * 9);
        y = RIM.y + 15 * dt / 0.30 + 20 * Math.sin(dt / 0.30 * Math.PI * 0.5);
      } else {
        const dt2 = dt - 0.30;
        if (dt2 < 0.34) {
          x = RIM.x + 3;
          y = 333 + 303 * smooth(dt2 / 0.34);
        } else {
          const dt3 = dt2 - 0.34;
          const bounce = Math.abs(Math.sin(dt3 * 8.8)) * 124 * Math.exp(-dt3 * 2.15);
          x = 1023 - Math.min(30, dt3 * 16);
          y = 636 - bounce;
        }
      }
      spinT = t * 3;
    }

    const jumpHeight = clamp(500 - root.y, 0, 140);
    if (y > 660) visible = false;

    return { x, y, held, visible, spinT, jumpHeight };
  }

  // ---------- arms ----------
  function getArms(t, root, ballState) {
    let near, far;

    if (t < 0.90) {
      near = { x: 212, y: -56 + Math.sin(t * 12) * 5 };
      far = { x: 180, y: -72 + Math.sin(t * 10 + 1) * 4 };
    } else if (t < RELEASE_TIME) {
      const hold = getHoldLocal(t);
      near = { x: hold.x - 17, y: hold.y + 9 };
      if (t < 2.35) {
        far = { x: hold.x - 31, y: hold.y - 2 };
      } else {
        const u = smooth((t - 2.35) / (RELEASE_TIME - 2.35));
        far = { x: lerp(hold.x - 31, 212, u), y: lerp(hold.y - 2, -153, u) };
      }
    } else if (t < 3.08) {
      near = { x: 338, y: -148 };
      far = { x: 195, y: -122 };
    } else if (t < 3.55) {
      const u = smooth((t - 3.08) / 0.47);
      near = { x: lerp(338, 220, u), y: lerp(-148, -118, u) };
      far = { x: 190, y: lerp(-122, -132, u) };
    } else {
      const wave = Math.sin(t * 11) * 6;
      const hop = Math.sin(clamp((t - 3.8) / 0.9, 0, 1) * Math.PI) * 7;
      near = { x: 268 + wave, y: -132 + hop };
      far = { x: 94 - wave, y: -146 + hop };
    }
    return { near, far };
  }

  function drawArm(arm, target, wiggle = 0) {
    const sx = arm.shoulder.x;
    const sy = arm.shoulder.y;
    const mx = (sx + target.x) / 2;
    const my = (sy + target.y) / 2;
    const dx = target.x - sx;
    const dy = target.y - sy;
    const len = Math.max(1, Math.hypot(dx, dy));
    const bend = clamp(len * 0.11, 7, 23) + wiggle;
    const cx = mx - dy / len * bend;
    const cy = my + dx / len * bend + 5;
    const d = `M${sx.toFixed(1)} ${sy.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${target.x.toFixed(1)} ${target.y.toFixed(1)}`;
    arm.outline.setAttribute("d", d);
    arm.fill.setAttribute("d", d);
    const angle = deg(Math.atan2(dy, dx));
    arm.hand.setAttribute("transform", `translate(${target.x.toFixed(1)} ${target.y.toFixed(1)}) rotate(${angle.toFixed(1)})`);
  }

  // ---------- dynamic scoreboard ----------
  const stepEvents = [1.15, 1.55, 1.95];
  const stepPositions = [455, 505, 555];

  function phaseAt(t) {
    if (t < 0.9) return "DRIBBLE";
    if (t < 1.35) return "STEP 1";
    if (t < 1.75) return "STEP 2";
    if (t < 2.12) return "STEP 3";
    if (t < RELEASE_TIME) return "TAKE FLIGHT";
    if (t < SCORE_TIME) return "LAYUP...";
    return "SWISH! +2";
  }

  function updateHUD(t) {
    const score = t >= SCORE_TIME ? 2 : 0;
    if (score !== lastScore) {
      lastScore = score;
      scoreValue.textContent = score === 0 ? "00" : "02";
      if (score === 2) {
        scoreFlash.setAttribute("opacity", ".28");
      }
    }
    const phase = phaseAt(t);
    if (phase !== lastPhase) {
      lastPhase = phase;
      phaseText.textContent = phase;
    }
    const sinceScore = t - SCORE_TIME;
    scoreFlash.setAttribute("opacity", sinceScore >= 0 && sinceScore < .34 ? (0.34 - sinceScore) * 0.82 : 0);

    for (let i = 0; i < 3; i++) {
      const lit = t >= stepEvents[i];
      if (lit !== stepLit[i]) {
        stepLit[i] = lit;
        stepDots[i].setAttribute("fill", lit ? "#ffb363" : "#102f30");
        stepDots[i].setAttribute("stroke", lit ? "#ffe0ad" : "#e3c39b");
        stepTexts[i].setAttribute("fill", lit ? "#123a3a" : "#9ab7a7");
      }
    }
  }

  // ---------- particles ----------
  const confettiPieces = [];
  const confettiColors = ["#f8ecd4", "#e56846", "#f3b65b", "#6ca36e", "#d5e5d8"];
  for (let i = 0; i < 22; i++) {
    const isRect = i % 3 !== 0;
    const el = document.createElementNS("http://www.w3.org/2000/svg", isRect ? "rect" : "circle");
    if (isRect) {
      el.setAttribute("width", 9 + (i % 4) * 3);
      el.setAttribute("height", 5 + (i % 3) * 3);
      el.setAttribute("rx", 1.5);
    } else {
      el.setAttribute("r", 4 + (i % 3));
    }
    el.setAttribute("fill", confettiColors[i % confettiColors.length]);
    confetti.appendChild(el);
    confettiPieces.push({
      el,
      x0: 770 + ((i * 53) % 335),
      y0: 286 + (i % 4) * 10,
      vx: -155 + (i * 47) % 310,
      vy: -230 - (i % 5) * 32,
      spin: -240 + (i * 113) % 480,
      delay: (i % 6) * 0.032
    });
  }

  const dustPuffs = [];
  const dustEvents = [
    { t: 1.15, x: 462 },
    { t: 1.55, x: 512 },
    { t: 1.95, x: 562 },
    { t: 3.30, x: 620 }
  ];
  dustEvents.forEach((event) => {
    for (let i = 0; i < 3; i++) {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("fill", "#f7e7cd");
      dust.appendChild(c);
      dustPuffs.push({
        el: c,
        event,
        dx: -20 + i * 20,
        r: 5 + i * 2.5,
        delay: i * 0.045
      });
    }
  });

  // ---------- per-frame render ----------
  function render(t) {
    const root = getRoot(t);
    trex.setAttribute("transform", `translate(${root.x.toFixed(2)} ${root.y.toFixed(2)})`);

    const nearTarget = getLegTarget("near", t, root);
    const farTarget = getLegTarget("far", t, root);
    placeLeg(legs.near, nearTarget);
    placeLeg(legs.far, farTarget);

    // tail and head keep the body alive between key poses.
    const tailWave = Math.sin(t * 5.1) * 3.1 + (t > 3.5 && t < 5.1 ? Math.sin((t - 3.5) * 8.5) * 7 : 0);
    const jumpAir = t > JUMP_START && t < JUMP_END ? -2.5 : 0;
    tail.setAttribute("transform", `rotate(${(tailWave + jumpAir).toFixed(2)} -40 -12)`);

    const headAngle = track(t, [
      [0, 0], [0.9, 1.5], [1.55, 2.4], [2.15, -2], [2.55, -4],
      [RELEASE_TIME, -5.5], [SCORE_TIME, -7], [3.55, -9], [4.05, -13],
      [4.55, -9], [5.8, 0]
    ]);
    head.setAttribute("transform", `rotate(${(headAngle + (t > 3.6 && t < 4.6 ? Math.sin(t * 12) * 1.8 : 0)).toFixed(2)} 185 -225)`);

    const jawAngle = track(t, [
      [0, 0], [.9, .8], [1.8, 1.6], [2.15, 5], [2.6, 8],
      [RELEASE_TIME, 8], [SCORE_TIME + .15, 14], [3.7, 13],
      [4.15, 8], [5.8, 0]
    ]);
    jaw.setAttribute("transform", `rotate(${jawAngle.toFixed(2)} 208 -171)`);

    const ribbon = 3 * Math.sin(t * 14) + (t > 2.15 && t < 3.6 ? -4 : 0);
    headbandTails.setAttribute("transform", `rotate(${ribbon.toFixed(2)} 198 -245)`);

    const ballState = getBallState(t, root);
    const armTargets = getArms(t, root, ballState);
    drawArm(arms.far, armTargets.far);
    const stretchWiggle = t > 2.42 && t < 3.04 ? Math.sin(t * 57) * 4.2 : 0;
    drawArm(arms.near, armTargets.near, stretchWiggle);

    if (ballState.visible) {
      ball.setAttribute("transform", `translate(${ballState.x.toFixed(2)} ${ballState.y.toFixed(2)}) rotate(${(ballState.spinT * 45).toFixed(1)})`);
      ball.style.display = "";
    } else {
      ball.style.display = "none";
    }
    ballShadow.setAttribute("cx", ballState.x.toFixed(2));
    ballShadow.setAttribute("cy", "650");
    const ballHeight = clamp(650 - ballState.y, 0, 350);
    ballShadow.setAttribute("rx", (22 + ballHeight * 0.018).toFixed(2));
    ballShadow.setAttribute("ry", (7 + ballHeight * 0.006).toFixed(2));
    ballShadow.setAttribute("opacity", (0.26 - ballHeight / 1600).toFixed(3));

    // claws on top of the ball when held
    if (ballState.held) {
      gripClaws.setAttribute("opacity", ".95");
      gripClaws.setAttribute("transform", `translate(${(ballState.x - 20).toFixed(1)} ${(ballState.y + 5).toFixed(1)}) rotate(-16)`);
    } else {
      gripClaws.setAttribute("opacity", "0");
    }

    // trail during the shot
    if (t > RELEASE_TIME && t < SCORE_TIME) {
      ballTrail.setAttribute("opacity", "1");
      for (let i = 0; i < 3; i++) {
        const tt = Math.max(RELEASE_TIME, t - 0.035 * (i + 1));
        const bs = getBallState(tt, root);
        const dot = trailDots[i];
        dot.setAttribute("cx", bs.x.toFixed(2));
        dot.setAttribute("cy", bs.y.toFixed(2));
      }
    } else {
      ballTrail.setAttribute("opacity", "0");
    }

    // shadow and follow light
    const airHeight = clamp(500 - root.y, 0, 120);
    const shadowScale = 1 - airHeight / 300;
    trexShadow.setAttribute("cx", (root.x + 22).toFixed(2));
    trexShadow.setAttribute("rx", (158 * shadowScale).toFixed(2));
    trexShadow.setAttribute("ry", (22 * shadowScale).toFixed(2));
    trexShadow.setAttribute("opacity", (0.3 * shadowScale).toFixed(3));
    followLight.setAttribute("cx", (root.x + 50).toFixed(2));

    // net ripple
    const sinceScore = t - SCORE_TIME;
    if (sinceScore >= 0) {
      const amp = Math.exp(-sinceScore * 6.2) * Math.sin(sinceScore * 21);
      netMesh.setAttribute("transform", `scale(${(1 + 0.035 * amp).toFixed(3)} ${(1 + 0.2 * amp).toFixed(3)}) rotate(${(3.5 * amp).toFixed(2)})`);
    } else {
      netMesh.setAttribute("transform", "scale(1 1) rotate(0)");
    }

    // score footprints
    for (let i = 0; i < 3; i++) {
      const since = t - stepEvents[i];
      const on = since >= 0;
      const pop = on ? smooth(since / 0.18) : 0;
      const fp = footprints[i];
      fp.setAttribute("opacity", on ? (0.34 + 0.42 * pop).toFixed(3) : "0");
      fp.setAttribute("transform",
        `translate(${stepPositions[i] + 8} 660) rotate(-8) scale(${(0.72 + 0.28 * pop).toFixed(3)})`);
    }

    // dust puffs
    dustPuffs.forEach((puff) => {
      const since = t - puff.event.t - puff.delay;
      if (since > 0 && since < 0.62) {
        const u = since / 0.62;
        puff.el.setAttribute("cx", (puff.event.x + puff.dx * u).toFixed(2));
        puff.el.setAttribute("cy", (655 - u * 23).toFixed(2));
        puff.el.setAttribute("r", (puff.r * (1 + u * 1.8)).toFixed(2));
        puff.el.setAttribute("opacity", ((1 - u) * 0.38).toFixed(3));
      } else {
        puff.el.setAttribute("opacity", "0");
      }
    });

    // confetti
    confettiPieces.forEach((piece) => {
      const since = t - SCORE_TIME - piece.delay;
      if (since > 0 && since < 1.9) {
        const x = piece.x0 + piece.vx * since;
        const y = piece.y0 + piece.vy * since + 0.5 * 610 * since * since;
        piece.el.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(piece.spin * since).toFixed(1)})`);
        piece.el.setAttribute("opacity", (1 - since / 1.9).toFixed(3));
      } else {
        piece.el.setAttribute("opacity", "0");
      }
    });

    // fade the whole action at loop boundaries
    const fadeIn = smooth(t / 0.22);
    const fadeOut = 1 - smooth((t - 5.12) / 0.55);
    actLayer.setAttribute("opacity", (fadeIn * fadeOut).toFixed(3));

    updateHUD(t);
  }

  // ---------- playback ----------
  function syncControl() {
    playback.classList.toggle("is-paused", paused);
    playback.setAttribute("aria-label", paused ? "播放动画" : "暂停动画");
    playback.title = paused ? "播放（空格）" : "暂停（空格）";
    playbackLabel.textContent = paused ? "播放" : "暂停";
    scene.classList.toggle("is-paused", paused);
  }

  function setPaused(next) {
    paused = next;
    lastFrame = performance.now();
    syncControl();
    if (paused) render(virtualTime % LOOP);
  }

  playback.addEventListener("click", () => setPaused(!paused));
  window.addEventListener("keydown", (event) => {
    if (event.code === "Space" && !event.repeat) {
      event.preventDefault();
      setPaused(!paused);
    }
  });
  reduceMotion.addEventListener?.("change", (event) => {
    if (event.matches) {
      virtualTime = 2.72;
      setPaused(true);
    }
  });

  function tick(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;
    if (!paused) {
      virtualTime += dt;
      if (virtualTime >= LOOP) {
        virtualTime %= LOOP;
        lastScore = null;
        lastPhase = null;
        stepLit = [false, false, false];
      }
      render(virtualTime);
    }
    requestAnimationFrame(tick);
  }

  // debug hook useful for pausing on a specific story beat
  window.__trexLayup = {
    setTime(value) {
      virtualTime = ((value % LOOP) + LOOP) % LOOP;
      lastScore = null;
      lastPhase = null;
      stepLit = [false, false, false];
      setPaused(true);
      render(virtualTime);
    },
    play() { setPaused(false); },
    pause() { setPaused(true); }
  };

  render(virtualTime);
  syncControl();
  requestAnimationFrame((now) => {
    lastFrame = now;
    requestAnimationFrame(tick);
  });
})();
</script>
</body>
</html>
