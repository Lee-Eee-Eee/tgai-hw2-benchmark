    padding: 14px 22px;

  .bar p  { margin: 3px 0 0; font-size: 12.5px; color: #7d8b99; }
  .bar .phase {

  }
  button {
    flex: none; border: 0; cursor: pointer;
    padding: 9px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: #fff;
    background: #e8524a; box-shadow: 0 4px 12px rgba(232,82,74,.35);
    transition: transform .15s ease, background .15s ease;
  }
  button:hover { transform: translateY(-1px); background: #d8443d; }
  button:active { transform: translateY(1px); }
  #lights { animation: flicker 5.5s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { opacity: .42; } 50% { opacity: .62; } }
  body.paused #lights { animation-play-state: paused; }
</style>
</head>

<script>
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);

  // ---------- tiny math helpers ----------
  const lerp = (a, b, p) => a + (b - a) * p;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const easeInOut = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
  const mix = (A, B, p) => ({ x: lerp(A.x, B.x, p), y: lerp(A.y, B.y, p) });

  function kf(t, keys) {                     // scalar keyframes [[time, value], ...]
    for (let i = 0; i < keys.length - 1; i++) {
      if (t <= keys[i+1][0]) return lerp(keys[i][1], keys[i+1][1], seg(t, keys[i][0], keys[i+1][0]));
    }
    return keys[keys.length-1][1];
  }

  function spline(t, keys) {                 // smooth path through [[time, x, y], ...]
    let i = 0;
    while (i < keys.length - 2 && t > keys[i+1][0]) i++;
    const p0 = keys[Math.max(0, i-1)], p1 = keys[i],
          p2 = keys[i+1], p3 = keys[Math.min(keys.length-1, i+2)];
    const u = clamp((t - p1[0]) / ((p2[0] - p1[0]) || 1), 0, 1);
    const u2 = u*u, u3 = u2*u;
    const h00 = 2*u3-3*u2+1, h10 = u3-2*u2+u, h01 = -2*u3+3*u2, h11 = u3-u2;
    const m1x = (p2[1]-p0[1])*.5, m1y = (p2[2]-p0[2])*.5;
    const m2x = (p3[1]-p1[1])*.5, m2y = (p3[2]-p1[2])*.5;
    return {
      x: h00*p1[1] + h10*m1x + h01*p2[1] + h11*m2x,
      y: h00*p1[2] + h10*m1y + h01*p2[2] + h11*m2y
    };
  }

  // ---------- constants ----------
  const S = 0.82;                 // dino scale
  const GROUND = 430;
  const BASE_Y = 282;             // hip scene-y when standing (feet at 430)
  const HIP_FAR  = { x: -16, y: 8 };
  const HIP_NEAR = { x:  14, y: 14 };
  const THIGH = 100, SHIN = 94;
  const LOOP = 5.10;

  // ---------- crowd (decorative) ----------
  const crowd = $("crowd");
  const crowdColors = ["#6b8fb5", "#8fa9c2", "#c98a6b", "#a2b7c9", "#5f9c8c", "#b98a9a"];
  for (let row = 0; row < 3; row++) {
    for (let i = 0; i < 39; i++) {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", 10 + i*25 + (row % 2)*12);
      c.setAttribute("cy", 60 + row*29);
      c.setAttribute("r", 5.4);
      c.setAttribute("fill", crowdColors[(i + row*3) % crowdColors.length]);
      c.setAttribute("opacity", ".32");
      crowd.appendChild(c);
    }
  }

  // ---------- timeline ----------
  const dinoXKeys = [[0,205],[1.90,350],[2.05,358],[2.35,450],[2.60,495],[2.75,495],[3.10,502],[3.55,510],[5.10,510]];
  const dinoYKeys = [[0,BASE_Y],[2.05,BASE_Y],[2.25,247],[2.50,207],[2.75,192],
                     [3.05,207],[3.30,247],[3.55,BASE_Y],[3.80,276],[4.05,BASE_Y],
                     [4.25,278],[4.55,BASE_Y],[5.10,BASE_Y]];
  const armNearKeys = [[0,18],[.35,38],[.70,2],[1.05,38],[1.40,4],[1.60,20],
                       [1.85,-48],[2.05,-58],[2.40,-88],[2.60,-100],[2.90,-100],
                       [3.20,-60],[3.55,-70],[3.75,-125],[3.95,-75],[4.15,-125],
                       [4.35,-80],[4.60,-55],[5.10,-55]];
  const armFarKeys  = [[0,-10],[.5,10],[1.0,-10],[1.6,-5],[1.9,-42],[2.6,-80],
                       [3.1,-40],[3.55,-30],[3.8,-95],[4.1,-40],[4.4,-90],[4.6,-25],[5.10,-25]];
  // the head tips back during the leap so the ball clears the snout
  const headTiltKeys = [[0,0],[2.05,0],[2.45,-18],[2.75,-24],[3.20,-10],[3.55,2],[4.10,0],[5.10,0]];

  const dinoX = t => kf(t, dinoXKeys);
  const dinoY = t => kf(t, dinoYKeys);
  const armNear = t => kf(t, armNearKeys);
  const armFar  = t => kf(t, armFarKeys);
  const headTilt = t => kf(t, headTiltKeys);

  // three explicit footfalls (scene x of each plant, plus a gather adjustment)
  const nearSteps = [
    { plant: 185, swing: null },
    { plant: 245, swing: [0.15, 0.55] },   // STEP 1
    { plant: 305, swing: [1.15, 1.60] },   // STEP 3
    { plant: 335, swing: [1.72, 1.95] }    // gather
  ];
  const farSteps = [
    { plant: 160, swing: null },
    { plant: 265, swing: [0.65, 1.05] },   // STEP 2
    { plant: 320, swing: [1.72, 1.95] }    // gather
  ];

  function footLocal(steps, t, cx) {
    let prev = steps[0].plant;
    for (let i = 1; i < steps.length; i++) {
      const [a, b] = steps[i].swing, dest = steps[i].plant;
      if (t < a) return { x: (prev - cx)/S, y: 180 };
      if (t <= b) {
        const p = (t - a)/(b - a), e = easeInOut(p);
        const sx = prev + (dest - prev)*e;
        return { x: (sx - cx)/S, y: 180 - 34*Math.sin(Math.PI*p) };
      }
      prev = dest;
    }
    return { x: (prev - cx)/S, y: 180 };
  }

  // two-bone inverse kinematics for the big hind legs
  function ik(H, P) {
    let dx = P.x - H.x, dy = P.y - H.y;
    let d = Math.hypot(dx, dy) || 0.001;
    const maxD = THIGH + SHIN - 0.01, minD = Math.abs(THIGH - SHIN) + 0.01;
    if (d > maxD) { const s = maxD/d; dx *= s; dy *= s; d = maxD; }
    if (d < minD) { const s = minD/d; dx *= s; dy *= s; d = minD; }
    const ux = dx/d, uy = dy/d;
    const along = (THIGH*THIGH - SHIN*SHIN + d*d)/(2*d);
    const out = Math.sqrt(Math.max(0, THIGH*THIGH - along*along));
    return { x: H.x + ux*along + uy*out, y: H.y + uy*along - ux*out };
  }

  const RELEASE_T = 2.50;
  const cradle = t => ({ x: dinoX(t) + 78, y: dinoY(t) - 25 });
  const rel = { x: dinoX(RELEASE_T) + 100, y: dinoY(RELEASE_T) - 35 };
  const lastDribble = {
    x: dinoX(1.60) + 92,
    y: 408 - 112*Math.abs(Math.sin(3*Math.PI*1.60/1.65))
  };
  const c185 = cradle(1.85), c220 = cradle(2.20);

  // ball is gathered to the chest, then flicked forward UNDER the snout
  const holdKeys = [
    [1.60, lastDribble.x,  lastDribble.y],
    [1.85, c185.x, c185.y],
    [2.20, c220.x, c220.y],
    [RELEASE_T, rel.x, rel.y]
  ];
  const flight = [
    [RELEASE_T, rel.x, rel.y],
    [2.68, 650, 158],
    [2.88, 730, 150],       // reaches the glass
    [3.02, 750, 166],       // bank off the backboard square
    [3.16, 760, 188],
    [3.30, 772, 212],       // at the rim
    [3.48, 772, 262],       // through the net
    [3.68, 780, 300],
    [3.88, 792, 392],       // bounce on the floor
    [4.08, 804, 366],
    [4.28, 816, 394],
    [4.60, 824, 396]
  ];

  // ---------- DOM handles ----------
  const actors = $("actors"), dino = $("dino"), ball = $("ball"), shadow = $("shadow");
  const thighFar = $("thighFar"), shinFar = $("shinFar"), kneeFar = $("kneeFar"), footFar = $("footFar");
  const thighNear = $("thighNear"), shinNear = $("shinNear"), kneeNear = $("kneeNear"), footNear = $("footNear");
  const tail = $("tail"), head = $("head"), aNear = $("armNear"), aFar = $("armFar");
  const netGroup = $("netGroup"), sparkles = $("sparkles"), swish = $("swish");
  const puffEls = [$("puff0"), $("puff1"), $("puff2")];
  const dots = [$("stepDot1"), $("stepDot2"), $("stepDot3")];
  const hudStatus = $("hudStatus"), phase = $("phase"), toggle = $("toggle");

  const puffTimes = [0.55, 1.05, 1.60];
  const puffXs    = [245, 265, 305];
  const doneTimes = [0.55, 1.05, 1.60];

  function statusFor(t) {
    if (t < 0.15) return "助跑运球 · DRIBBLE";
    if (t < 0.65) return "第一步 · STEP 1";
    if (t < 1.15) return "第二步 · STEP 2";
    if (t < 1.60) return "第三步 · STEP 3";
    if (t < 2.05) return "收球起跳 · GATHER";
    if (t < 2.75) return "上篮！ · LAYUP!";
    if (t < 3.30) return "打板 · BANK SHOT";
    if (t < 4.40) return "空心入网 · SWISH! +2";
    return "下一回合 · REPLAY";
  }

  function render(t) {
    const cx = dinoX(t), cy = dinoY(t);
    dino.setAttribute("transform", "translate(" + cx.toFixed(2) + " " + cy.toFixed(2) + ") scale(" + S + ")");

    // ---- feet / legs ----
    const frozen = dinoX(Math.min(t, 1.95));
    let fFar  = footLocal(farSteps,  Math.min(t, 1.95), t <= 1.95 ? cx : frozen);
    let fNear = footLocal(nearSteps, Math.min(t, 1.95), t <= 1.95 ? cx : frozen);
    if (t > 1.95) {
      const up = easeInOut(seg(t, 1.98, 2.38));
      fFar  = mix(fFar,  { x: -34, y: 112 }, up);
      fNear = mix(fNear, { x:  26, y: 128 }, up);
      const down = easeInOut(seg(t, 3.18, 3.55));
      fFar  = mix(fFar,  { x: -34, y: 180 }, down);
      fNear = mix(fNear, { x:  16, y: 180 }, down);
    }
    const kFar = ik(HIP_FAR, fFar), kNear = ik(HIP_NEAR, fNear);
    thighFar.setAttribute("d", "M" + HIP_FAR.x + " " + HIP_FAR.y + " L" + kFar.x.toFixed(1) + " " + kFar.y.toFixed(1));
    shinFar.setAttribute("d",  "M" + kFar.x.toFixed(1) + " " + kFar.y.toFixed(1) + " L" + fFar.x.toFixed(1) + " " + fFar.y.toFixed(1));
    thighNear.setAttribute("d", "M" + HIP_NEAR.x + " " + HIP_NEAR.y + " L" + kNear.x.toFixed(1) + " " + kNear.y.toFixed(1));
    shinNear.setAttribute("d",  "M" + kNear.x.toFixed(1) + " " + kNear.y.toFixed(1) + " L" + fNear.x.toFixed(1) + " " + fNear.y.toFixed(1));
    kneeFar.setAttribute("cx", kFar.x.toFixed(1));   kneeFar.setAttribute("cy", kFar.y.toFixed(1));
    kneeNear.setAttribute("cx", kNear.x.toFixed(1)); kneeNear.setAttribute("cy", kNear.y.toFixed(1));
    footFar.setAttribute("transform",  "translate(" + fFar.x.toFixed(1)  + " " + fFar.y.toFixed(1)  + ") rotate(" + (fFar.y  < 170 ? -11 : 0) + ")");
    footNear.setAttribute("transform", "translate(" + fNear.x.toFixed(1) + " " + fNear.y.toFixed(1) + ") rotate(" + (fNear.y < 170 ? -11 : 0) + ")");

    // ---- wagging parts ----
    tail.setAttribute("transform", "rotate(" + (5.5*Math.sin(t*7)).toFixed(2) + " -44 -20)");
    head.setAttribute("transform", "rotate(" + (headTilt(t) + 2.2*Math.sin(t*5 + 1)).toFixed(2) + " 100 -100)");
    aNear.setAttribute("transform", "rotate(" + armNear(t).toFixed(2) + " 76 -46)");
    aFar.setAttribute("transform",  "rotate(" + armFar(t).toFixed(2)  + " 68 -52)");

    // ---- ball ----
    let bp, spin = t*390, scale = 1;
    if (t < 1.60) {
      const bounce = Math.abs(Math.sin(3*Math.PI*t/1.65));
      bp = { x: cx + 92, y: 408 - 112*bounce };
    } else if (t < RELEASE_T) {
      bp = spline(t, holdKeys);
    } else {
      bp = spline(Math.min(t, 4.60), flight);
      scale = 1 - 0.13*Math.max(0, 1 - Math.abs(t - 3.39)/0.17);
    }
    ball.setAttribute("transform", "translate(" + bp.x.toFixed(1) + " " + bp.y.toFixed(1) + ") rotate(" + spin.toFixed(1) + ") scale(" + scale.toFixed(3) + ")");

    // ---- shadow ----
    const jump = clamp((BASE_Y - cy)/90, 0, 1);
    shadow.setAttribute("cx", cx.toFixed(1));
    shadow.setAttribute("rx", (96 - 38*jump).toFixed(1));
    shadow.setAttribute("opacity", (0.2 - 0.11*jump).toFixed(3));

    // ---- dust puffs at each footfall ----
    for (let i = 0; i < 3; i++) {
      const age = t - puffTimes[i];
      const k = age < 0 || age > 0.38 ? 0 : 1 - age/0.38;
      puffEls[i].setAttribute("opacity", (k*0.85).toFixed(3));
      puffEls[i].setAttribute("transform", "translate(" + puffXs[i] + " 424) scale(" + (0.5 + 0.9*(1-k)).toFixed(2) + ")");
    }

    // ---- net swish ----
    const nw = t > 3.30 ? 6.5*Math.sin((t-3.30)*21)*Math.exp(-(t-3.30)*3.2) : 0;
    netGroup.setAttribute("transform", "rotate(" + nw.toFixed(2) + " 770 212)");

    // ---- score celebration ----
    const scoreK = clamp(seg(t, 3.36, 4.35), 0, 1);
    sparkles.setAttribute("opacity", (Math.sin(Math.PI*scoreK)*0.95).toFixed(3));
    sparkles.setAttribute("transform", "translate(770 210) scale(" + (0.85 + 0.35*Math.sin(Math.PI*scoreK)).toFixed(3) + ") translate(-770 -210)");
    const pop = clamp(seg(t, 3.38, 3.58), 0, 1);
    const sink = clamp(seg(t, 4.05, 4.40), 0, 1);
    swish.setAttribute("opacity", (pop*(1-sink)).toFixed(3));
    swish.setAttribute("transform", "translate(770 74) scale(" + (0.55 + 0.55*easeInOut(pop)).toFixed(3) + ") translate(-770 -74)");

    // ---- HUD ----
    const st = statusFor(t);
    if (hudStatus.textContent !== st) { hudStatus.textContent = st; phase.textContent = st; }
    for (let i = 0; i < 3; i++) {
      dots[i].firstElementChild.setAttribute("fill", t >= doneTimes[i] ? "#ffb03b" : "#31465e");
    }

    // ---- loop crossfade ----
    const fadeIn  = clamp(seg(t, 0, 0.25), 0, 1);
    const fadeOut = 1 - clamp(seg(t, 4.60, 4.92), 0, 1);
    actors.setAttribute("opacity", Math.min(fadeIn, fadeOut).toFixed(3));
  }

  // ---------- driver ----------
  let t = 0, last = performance.now(), running = true;

  function frame(now) {
    const dt = Math.min(0.05, (now - last)/1000);
    last = now;
    if (running) { t += dt; if (t >= LOOP) t -= LOOP; }
    render(t);
    requestAnimationFrame(frame);
  }

  function setRunning(on) {
    running = on;
    document.body.classList.toggle("paused", !on);
    toggle.textContent = on ? "Pause" : "Play";
    toggle.setAttribute("aria-pressed", String(!on));
  }
  toggle.addEventListener("click", () => setRunning(!running));
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) setRunning(false);

  render(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
