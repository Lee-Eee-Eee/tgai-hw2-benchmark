<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 28px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% -10%, #2a3b52 0%, #141c26 55%, #0d1219 100%);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  .stage { width: min(920px, 100%); }
  .card {
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 28px 70px rgba(0, 0, 0, .5), 0 2px 0 rgba(255,255,255,.08) inset;
  }
  svg#scene { display: block; width: 100%; height: auto; }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 15px 22px;
    background: linear-gradient(#fbfcfd, #f2f5f8);
    border-top: 1px solid #e3e9ee;
  }
  .bar h1 { margin: 0; font-size: 17px; letter-spacing: .2px; color: #243447; }
  .bar p  { margin: 3px 0 0; font-size: 12.5px; color: #7d8b99; }
  button {
    flex: none;
    border: 0;
    cursor: pointer;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: #e8524a;
    box-shadow: 0 4px 12px rgba(232,82,74,.35);
    transition: transform .15s ease, background .15s ease;
  }
  button:hover { transform: translateY(-1px); background: #d8443d; }
  button:active { transform: translateY(1px); }

  /* ---- background motion ---- */
  .cloud { animation: drift var(--dur, 28s) linear infinite; animation-delay: var(--delay, 0s); }
  @keyframes drift {
    /* both ends are fully off-screen for every cloud, so the loop never pops */
    from { transform: translateX(900px); }
    to   { transform: translateX(-820px); }
  }
  .dashes { animation: roll .575s linear infinite; }
  @keyframes roll {
    from { transform: translateX(0); }
    to   { transform: translateX(-80px); }
  }
  .streak { animation: streak .95s linear infinite; }
  .streak:nth-of-type(2) { animation-delay: -.32s; }
  .streak:nth-of-type(3) { animation-delay: -.64s; }
  @keyframes streak {
    0%   { transform: translateX(46px); opacity: 0; }
    25%  { opacity: .6; }
    100% { transform: translateX(-70px); opacity: 0; }
  }
  #sun { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.055); }
  }
  body.paused .cloud,
  body.paused .dashes,
  body.paused .streak,
  body.paused #sun { animation-play-state: paused; }
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <svg id="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet"
         role="img" aria-labelledby="svgTitle svgDesc"
         xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink">
      <title id="svgTitle">A pelican riding a bicycle</title>
      <desc id="svgDesc">An animated cartoon pelican in a red helmet pedals a coral bicycle along a scrolling road, with spinning wheels, moving clouds, and a wobbling beak pouch.</desc>

        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);
  const wheelRear = $("wheelRearSpin"), wheelFront = $("wheelFrontSpin");
  const crank = $("crankSpin"), pelican = $("pelican"), pouch = $("pouchGroup");
  const pedalA = $("pedalA"), pedalB = $("pedalB");
  const footA = $("footA"), footB = $("footB");
  const legFar = $("legFarPath"), legNear = $("legNearPath");
  const kneeFar = $("kneeFar"), kneeNear = $("kneeNear");
  const toggle = $("toggle");

  // --- geometry -------------------------------------------------------
  const C   = { x: 380, y: 370 };   // bottom bracket
  const R   = 32;                   // crank radius
  const BONE = 78;                  // thigh & shin length
  const HIP_FAR  = { x: 326, y: 236 };
  const HIP_NEAR = { x: 356, y: 236 };

  // two-bone inverse kinematics: find a knee so hip -> knee -> foot fits
  function kneeFor(H, P, bob) {
    const hip = { x: H.x, y: H.y + bob };
    let dx = P.x - hip.x, dy = P.y - hip.y;
    let d = Math.hypot(dx, dy) || 0.001;
    const maxD = BONE * 2 - 0.01, minD = 0.01;
    if (d > maxD) { const s = maxD / d; dx *= s; dy *= s; d = maxD; }
    if (d < minD) { const s = minD / d; dx *= s; dy *= s; d = minD; }
    const ux = dx / d, uy = dy / d;
    const along = (BONE * BONE - BONE * BONE + d * d) / (2 * d); // = d/2
    const out = Math.sqrt(Math.max(0, BONE * BONE - along * along));
    // perpendicular chosen so the knee points forward (to the right)
    return {
      hip: hip,
      knee: { x: hip.x + ux * along + uy * out, y: hip.y + uy * along - ux * out }
    };
  }

  // --- animation state ------------------------------------------------
  const PERIOD = 1.15;                     // seconds per crank revolution
  const OMEGA = 2 * Math.PI / PERIOD;
  let t = 0, last = performance.now(), running = true;

  function render(time) {
    const th = time * OMEGA;              // crank angle (radians)
    const deg = th * 180 / Math.PI;

    // gear ratio chainring(22) : rear cog(11) => wheels spin 2x the crank
    wheelRear.setAttribute("transform", "rotate(" + (deg * 2) + ")");
    wheelFront.setAttribute("transform", "rotate(" + (deg * 2) + ")");
    crank.setAttribute("transform", "rotate(" + deg + " 380 370)");

    const p1 = { x: C.x + R * Math.cos(th), y: C.y + R * Math.sin(th) };
    const p2 = { x: C.x - R * Math.cos(th), y: C.y - R * Math.sin(th) };

    pedalA.setAttribute("transform", "translate(" + p1.x + " " + p1.y + ")");
    pedalB.setAttribute("transform", "translate(" + p2.x + " " + p2.y + ")");
    const tilt = 7 * Math.sin(th);
    footA.setAttribute("transform", "translate(" + p1.x + " " + (p1.y - 4) + ") rotate(" + tilt + ")");
    footB.setAttribute("transform", "translate(" + p2.x + " " + (p2.y - 4) + ") rotate(" + (-tilt) + ")");

    // the rider bobs twice per pedal revolution
    const bob = 2.6 * Math.sin(2 * th + 0.5);
    pelican.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
    pouch.setAttribute("transform", "rotate(" + (1.8 * Math.sin(2 * th)).toFixed(2) + " 490 108)");

    const far  = kneeFor(HIP_FAR,  p2, bob);
    const near = kneeFor(HIP_NEAR, p1, bob);
    legFar.setAttribute("d",
      "M" + far.hip.x + " " + far.hip.y.toFixed(1) +
      " L" + far.knee.x.toFixed(1) + " " + far.knee.y.toFixed(1) +
      " L" + p2.x.toFixed(1) + " " + p2.y.toFixed(1));
    legNear.setAttribute("d",
      "M" + near.hip.x + " " + near.hip.y.toFixed(1) +
      " L" + near.knee.x.toFixed(1) + " " + near.knee.y.toFixed(1) +
      " L" + p1.x.toFixed(1) + " " + p1.y.toFixed(1));
    kneeFar.setAttribute("cx", far.knee.x.toFixed(1));
    kneeFar.setAttribute("cy", far.knee.y.toFixed(1));
    kneeNear.setAttribute("cx", near.knee.x.toFixed(1));
    kneeNear.setAttribute("cy", near.knee.y.toFixed(1));
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) t += dt;
    render(t);
    requestAnimationFrame(frame);
  }

  function setRunning(on) {
    running = on;
    document.body.classList.toggle("paused", !on);
    toggle.textContent = on ? "Pause" : "Play";
    toggle.setAttribute("aria-pressed", String(!on));
  }

  toggle.addEventListener("click", () => setRunning(!running));

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    setRunning(false);
  }

  render(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
