<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="八套 Agent 配置的 SVG 动画原作。选择题目与模型，观看鹈鹕骑自行车或霸王龙三步上篮。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
  <title>SVG 动画基准</title>
  <link rel="icon" href="media/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="gallery.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <h1>SVG 动画基准</h1>
    <fieldset class="tasks">
      <legend class="sr-only">选择题目</legend>
      <label><input type="radio" name="task" value="pelican" checked><span>鹈鹕骑车</span></label>
      <label><input type="radio" name="task" value="trex"><span>霸王龙上篮</span></label>
    </fieldset>
    <div class="model-picker">
      <button type="button" id="model-button" aria-haspopup="menu" aria-expanded="false" aria-controls="model-menu">
        <img src="media/brands/claude.png" width="20" height="20" alt="">
        <span id="model-name">Claude Fable 5.2</span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div id="model-menu" role="menu" aria-label="选择模型" hidden></div>
    </div>
  </header>
  <main class="stage" aria-label="动画原作">
    <iframe id="work" title="动画原作" sandbox="allow-scripts allow-downloads"></iframe>
    <noscript><a href="demos/claudefable5.2/pelican-bicycle.html">打开默认动画</a></noscript>
  </main>
</body>
</html>
