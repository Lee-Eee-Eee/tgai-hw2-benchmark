<head>

  <style>
    :root {
      color-scheme: light;
      --ink: #243e35;
      --cream: #f4eddd;
      --rust: #a74e32;
      --rule: #b8b29c;
      font-family: system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background: var(--cream);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; }
    main { width: min(100% - clamp(24px, 7vw, 104px), 1150px); margin: 0 auto; padding: clamp(18px, 3.7vh, 42px) 0 24px; }
    header { display: flex; align-items: center; gap: clamp(10px, 1.3vw, 20px); margin: 0 0 clamp(12px, 2.1vh, 22px); }
    header svg { width: clamp(32px, 3.7vw, 53px); height: auto; flex: none; color: var(--rust); }
    h1 { margin: 0; font-size: clamp(25px, 3.1vw, 45px); line-height: 1.22; letter-spacing: .025em; font-weight: 800; }
    .stage { overflow: hidden; border: 1.4px solid #586558; border-radius: 3px; background: #f5ead1; }
    #layup { display: block; width: 100%; height: auto; aspect-ratio: 1100 / 540; }
    .transport { display: flex; align-items: center; gap: clamp(12px, 1.8vw, 24px); padding: 12px 0; flex-wrap: nowrap; }
    button { appearance: none; flex: none; display: inline-flex; gap: 8px; justify-content: center; align-items: center; min-height: 44px; cursor: pointer; color: var(--ink); line-height: 1.2; font-family: inherit; font-weight: 650; font-size: 14px; -webkit-tap-highlight-color: transparent; }
    #play { min-width: 86px; border-radius: 24px; padding: 0 17px; border: 1px solid var(--ink); color: #fff9eb; background: var(--ink); }
    #play:hover { background: #345146; }
    button svg { width: 16px; height: 16px; }
    #play svg { fill: currentColor; }
    [hidden] { display: none !important; }
    #replay { height: 44px; width: 44px; border-radius: 50%; border: 1px solid #a4a38d; background: transparent; }
    #replay:hover { background: #e8dfc9; }
    #replay svg { width: 19px; height: 19px; }
    #phase { flex: none; min-width: 5.5em; font-size: 14px; font-weight: 650; letter-spacing: .015em; }
    .seek { display: flex; flex: 1; align-items: center; min-width: 40px; height: 44px; }
    #seek { --progress: 0%; appearance: none; -webkit-appearance: none; width: 100%; height: 24px; padding: 0; margin: 0; cursor: pointer; border: 0; border-radius: 3px; background: transparent; color: var(--rust); accent-color: var(--rust); }
    #seek::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--rust) var(--progress), var(--rule) var(--progress)); }
    #seek::-webkit-slider-thumb { appearance: none; width: 13px; height: 13px; margin-top: -5px; border: 2px solid var(--cream); border-radius: 50%; background: var(--rust); box-shadow: 0 0 0 1px var(--rust); }
    #seek::-moz-range-track { height: 3px; background: var(--rule); }
    #seek::-moz-range-progress { height: 3px; background: var(--rust); }
    #seek::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--cream); background: var(--rust); box-shadow: 0 0 0 1px var(--rust); }
    button:focus-visible, input:focus-visible { outline: 3px solid #a74e32; outline-offset: 4px; }
    @media (max-width: 560px) {
      main { width: calc(100% - 24px); }
      .transport { column-gap: 11px; row-gap: 0; flex-wrap: wrap; padding-top: 5px; }
      .seek { flex-basis: 100%; order: -1; height: 33px; }
      #phase { flex: 1; }
      #replay { width: 44px; }
    }
  </style>
</head>

    <div class="transport" role="group" aria-label="动画播放控制">
      <button type="button" id="play" aria-label="暂停动画" aria-controls="layup">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path id="pause-icon" d="M3 2h3.2v12H3zm6.8 0H13v12H9.8z"/>
          <path id="play-icon" hidden d="M4 1.8 14 8 4 14.2Z"/>
        </svg>
        <span id="play-label">暂停</span>
      </button>
      <span id="phase" role="status" aria-live="polite" aria-atomic="true">运球助跑</span>
      <div class="seek"><input id="seek" type="range" min="0" max="8.4" step=".01" value="0" aria-label="动画进度" aria-controls="layup"></div>
      <button type="button" id="replay" aria-label="从头播放" title="从头播放" aria-controls="layup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9a8 8 0 1 1-.2 5M4.5 3.7V9h5.2"/></svg>
      </button>
    </div>
  </main>
  <script>
    const duration = 8.4;
    const phases = [
      [0, '运球助跑'], [1.90, '收球迈右脚'], [2.78, '左脚踏地'],
      [3.34, '腾空上篮'], [4.00, '出手擦板'], [4.93, '篮球入网'], [5.45, '落地回稳']
    ];
    const art = document.getElementById('layup');
    const play = document.getElementById('play');
    const seek = document.getElementById('seek');
    const phase = document.getElementById('phase');
    const playLabel = document.getElementById('play-label');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let frame = 0;
    let dragging = false;

    function paint(time) {
      const elapsed = time % duration;
      let label = phases[0][1];
      for (const [start, name] of phases) {
        if (elapsed < start) break;
        label = name;
      }
      if (phase.textContent !== label) phase.textContent = label;
      if (!dragging) seek.value = elapsed.toFixed(2);
      seek.style.setProperty('--progress', (Number(seek.value) / duration * 100) + '%');
      seek.setAttribute('aria-valuetext', elapsed.toFixed(1) + ' 秒，' + label);
    }
    function tick() {
      paint(art.getCurrentTime());
      if (!art.animationsPaused()) frame = requestAnimationFrame(tick);
    }
    function setPlaying(playing) {
      cancelAnimationFrame(frame);
      if (playing) art.unpauseAnimations();
      else art.pauseAnimations();
      playLabel.textContent = playing ? '暂停' : '播放';
      play.setAttribute('aria-label', playLabel.textContent + '动画');
      playIcon.toggleAttribute('hidden', playing);
      pauseIcon.toggleAttribute('hidden', !playing);
      tick();
    }
    function seekWithinCycle(value) {
      const cycleStart = Math.floor(art.getCurrentTime() / duration) * duration;
      const offset = Math.max(0, Math.min(duration - .001, value));
      art.setCurrentTime(cycleStart + offset);
      paint(cycleStart + offset);
    }
    play.addEventListener('click', () => setPlaying(art.animationsPaused()));
    document.getElementById('replay').addEventListener('click', () => {
      art.setCurrentTime(0);
      setPlaying(true);
    });
    seek.addEventListener('pointerdown', () => { dragging = true; });
    window.addEventListener('pointerup', () => { dragging = false; });
    window.addEventListener('pointercancel', () => { dragging = false; });
    seek.addEventListener('input', () => seekWithinCycle(Number(seek.value)));
    motion.addEventListener('change', event => setPlaying(!event.matches));
    setPlaying(!motion.matches);
  </script>
