<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>霸王龙 · 三步上篮 — SVG 动画</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eaf1df;
      --muted: #9fb4ae;
      --night: #0d2933;
      --panel: #123640;
      --orange: #f28b54;
      --mint: #a9c98e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(16px, 3.5vw, 42px);
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 0%, rgba(80,133,123,.18), transparent 32%),
        radial-gradient(circle at 90% 90%, rgba(242,139,84,.09), transparent 28%),
        #091f27;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    }

    main { width: min(1180px, 100%); }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 4px 18px;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.12;
      letter-spacing: -.04em;
    }
    h1 span { color: var(--mint); }
    .controls { display: flex; gap: 9px; flex: none; }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 44px;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid rgba(234,241,223,.15);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,255,255,.055);
      font: 700 13px/1 inherit;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease, border-color .18s ease;
    }
    button:hover { background: rgba(255,255,255,.11); border-color: rgba(234,241,223,.3); transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid rgba(169,201,142,.4); outline-offset: 3px; }
    button svg { width: 15px; height: 15px; }

    figure {
      overflow: hidden;
      margin: 0;
      border: 1px solid rgba(234,241,223,.12);
      border-radius: clamp(20px, 3vw, 32px);
      background: var(--panel);
      box-shadow: 0 28px 80px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.05);
    }
    .scene { display: block; width: 100%; height: auto; }

    .phases {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid rgba(234,241,223,.09);
      background: rgba(234,241,223,.09);
    }
    .phases li {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
      padding: 12px;
      color: #91aaa6;
      background: #102f39;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .phases b {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 11px;
    }
    .phase-one { animation: phase-one 7s linear infinite; }
    .phase-two { animation: phase-two 7s linear infinite; }
    .phase-three { animation: phase-three 7s linear infinite; }

    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 13px 6px 0;
      color: var(--muted);
      font-size: 12px;
    }
    figcaption span:last-child { color: #617f7d; }

    /* One seven-second timeline drives the entire layup. */
    .trex-motion { animation: trex-travel 7s linear infinite; transform-box: view-box; }
    .trex-visibility { animation: trex-visibility 7s linear infinite; }
    .ball-motion { animation: ball-flight 7s linear infinite; transform-box: view-box; }
    .ball-visibility { animation: ball-visibility 7s linear infinite; }
    .ball-spin { animation: ball-spin .62s linear infinite; transform-box: view-box; transform-origin: 535px 390px; }
    .dino-shadow { animation: shadow-travel 7s linear infinite; transform-box: view-box; transform-origin: 420px 604px; }
    .body-bob { animation: body-bob .35s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 390px 440px; }
    .head-focus { animation: head-focus 7s ease-in-out infinite; transform-box: view-box; transform-origin: 450px 300px; }
    .jersey-number { animation: number-flash 7s linear infinite; }
    .net { animation: net-sway 7s linear infinite; transform-box: view-box; transform-origin: 951px 322px; }
    .score-pop { animation: score-pop 7s ease-out infinite; transform-box: view-box; transform-origin: 935px 230px; }
    .speed-one { animation: speed-one 7s linear infinite; }
    .speed-two { animation: speed-two 7s linear infinite; }
    .dust { animation: dust 7s ease-out infinite; transform-box: view-box; transform-origin: 675px 583px; }
    .crowd-arm-a { animation: cheer .7s ease-in-out infinite alternate; transform-origin: 160px 385px; }
    .crowd-arm-b { animation: cheer .9s ease-in-out -.3s infinite alternate-reverse; transform-origin: 730px 380px; }
    .light-beam { animation: light-pulse 4s ease-in-out infinite alternate; }
    .sweat { animation: sweat 7s linear infinite; }

    @keyframes trex-travel {
      0%, 8% { transform: translate(0, 0); }
      22% { transform: translate(70px, 0); }
      36% { transform: translate(140px, 0); }
      48% { transform: translate(195px, -68px); }
      58% { transform: translate(250px, -120px); }
      66% { transform: translate(270px, -105px); }
      78% { transform: translate(292px, -35px); }
      86%, 96% { transform: translate(305px, 0); }
      96.01%, 100% { transform: translate(0, 0); }
    }
    @keyframes trex-visibility {
      0%, 89% { opacity: 1; }
      94%, 97% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes ball-flight {
      0%, 8% { transform: translate(0, 0); }
      22% { transform: translate(70px, 0); }
      36% { transform: translate(140px, 0); }
      48% { transform: translate(195px, -68px); }
      56% { transform: translate(245px, -118px); }
      61% { transform: translate(315px, -165px); }
      65% { transform: translate(365px, -145px); }
      70% { transform: translate(405px, -90px); }
      74% { transform: translate(410px, -58px); }
      82% { transform: translate(410px, 100px); }
      87% { transform: translate(392px, 137px); }
      92%, 96% { transform: translate(375px, 108px); }
      96.01%, 100% { transform: translate(0, 0); }
    }
    @keyframes ball-visibility {
      0%, 90% { opacity: 1; }
      94%, 98% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes ball-spin { to { transform: rotate(360deg); } }
    @keyframes shadow-travel {
      0%, 8% { transform: translate(0,0) scale(1); opacity: .32; }
      22% { transform: translate(70px,0) scale(.95); opacity: .3; }
      36% { transform: translate(140px,0) scale(.9); opacity: .28; }
      58% { transform: translate(250px,0) scale(.48); opacity: .14; }
      66% { transform: translate(270px,0) scale(.55); opacity: .16; }
      86%, 96% { transform: translate(305px,0) scale(1); opacity: .32; }
      96.01%, 100% { transform: translate(0,0) scale(1); opacity: .32; }
    }
    @keyframes body-bob { to { transform: translateY(-3px) rotate(-.5deg); } }
    @keyframes head-focus {
      0%, 36%, 100% { transform: rotate(0); }
      48%, 68% { transform: rotate(-5deg); }
      82% { transform: rotate(3deg); }
    }
    @keyframes number-flash { 0%, 70%, 82%, 100% { fill: #173e3b; } 74%, 78% { fill: #f28b54; } }
    @keyframes net-sway {
      0%, 70%, 84%, 100% { transform: skewX(0); }
      74% { transform: skewX(10deg) scaleY(1.1); }
      78% { transform: skewX(-7deg) scaleY(.96); }
    }
    @keyframes score-pop {
      0%, 69% { opacity: 0; transform: translateY(18px) scale(.65) rotate(-8deg); }
      73% { opacity: 1; transform: translateY(0) scale(1.12) rotate(-8deg); }
      78% { opacity: 1; transform: translateY(-10px) scale(1) rotate(-8deg); }
      88%, 100% { opacity: 0; transform: translateY(-45px) scale(.95) rotate(-8deg); }
    }
    @keyframes speed-one { 0%, 7%, 38%, 100% { opacity: 0; } 12%, 32% { opacity: .8; } }
    @keyframes speed-two { 0%, 35%, 69%, 100% { opacity: 0; } 44%, 61% { opacity: .75; } }
    @keyframes dust {
      0%, 81% { opacity: 0; transform: scale(.3) translateY(8px); }
      85% { opacity: .75; transform: scale(1) translateY(0); }
      92%, 100% { opacity: 0; transform: scale(1.5) translateY(-12px); }
    }
    @keyframes cheer { to { transform: rotate(8deg) translateY(-3px); } }
    @keyframes light-pulse { to { opacity: .55; } }
    @keyframes sweat { 0%, 37%, 66%, 100% { opacity: 0; } 44%, 58% { opacity: .8; } }

    @keyframes phase-one {
      0%, 20% { color: #102f39; background: #a9c98e; }
      23%, 100% { color: #91aaa6; background: #102f39; }
    }
    @keyframes phase-two {
      0%, 20% { color: #91aaa6; background: #102f39; }
      23%, 35% { color: #102f39; background: #f0c979; }
      38%, 100% { color: #91aaa6; background: #102f39; }
    }
    @keyframes phase-three {
      0%, 35% { color: #91aaa6; background: #102f39; }
      39%, 82% { color: #102f39; background: #f28b54; }
      86%, 100% { color: #91aaa6; background: #102f39; }
    }

    .paused .scene *, .paused .scene, .paused .phases li { animation-play-state: paused !important; }
    @media (max-width: 650px) {
      body { padding: 15px; }
      header { align-items: center; gap: 12px; }
      .eyebrow { font-size: 9px; }
      .controls { gap: 6px; }
      button { padding: 10px 12px; }
      .button-label { display: none; }
      .phases li { gap: 6px; min-height: 52px; padding: 8px 4px; font-size: 11px; }
      .phases b { width: 22px; height: 22px; }
      figcaption span:last-child { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene *, .scene, .phases li { animation-play-state: paused !important; }
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">SVG 动画 · 篮球时间</p>
        <h1>霸王龙 · <span>三步上篮</span></h1>
      </div>
      <div class="controls">
        <button id="restartButton" type="button" aria-label="从头重播">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.1 5.1A6 6 0 1 1 2 10.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M2.7 1.8v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="button-label">重播</span>
        </button>
        <button id="motionToggle" type="button" aria-label="暂停动画">
          <svg id="pauseIcon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg>
          <svg id="playIcon" viewBox="0 0 16 16" aria-hidden="true" style="display:none"><path d="M4 2.8c0-.8.9-1.3 1.6-.9l8 5.2c.6.4.6 1.4 0 1.8l-8 5.2c-.7.4-1.6-.1-1.6-.9V2.8Z" fill="currentColor"/></svg>
          <span class="button-label" id="buttonLabel">暂停</span>
        </button>
      </div>
    </header>

    <figure>
      <svg class="scene" id="trexScene" viewBox="0 0 1200 760" role="img" aria-labelledby="sceneTitle sceneDesc" xmlns="http://www.w3.org/2000/svg">
        <title id="sceneTitle">霸王龙在篮球场上完成三步上篮</title>
        <desc id="sceneDesc">一只穿着三号球衣的绿色霸王龙，跨两步后腾空，将橙色篮球送入右侧篮筐。动画循环播放，底部标注跨步、蹬地和腾空出手三个阶段。</desc>
        <defs>
          <linearGradient id="arena" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0b2732"/>
            <stop offset="1" stop-color="#1a4950"/>
          </linearGradient>
          <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d6a96e"/>
            <stop offset="1" stop-color="#b67d4f"/>
          </linearGradient>
          <linearGradient id="dinoGreen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a8c98c"/>
            <stop offset="1" stop-color="#6f9e73"/>
          </linearGradient>
          <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff4d8"/>
            <stop offset="1" stop-color="#e5dbc1"/>
          </linearGradient>
          <radialGradient id="ballOrange" cx="35%" cy="28%">
            <stop offset="0" stop-color="#ffbf68"/>
            <stop offset="1" stop-color="#e66f3f"/>
          </radialGradient>
          <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff8cf" stop-opacity=".18"/>
            <stop offset="1" stop-color="#fff8cf" stop-opacity="0"/>
          </linearGradient>
          <filter id="blurShadow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
          <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <clipPath id="courtClip"><path d="M0 487H1200V760H0Z"/></clipPath>
        </defs>

        <!-- Arena -->
        <rect width="1200" height="760" fill="url(#arena)"/>
        <path class="light-beam" d="M115 0h125l170 490H0Z" fill="url(#beam)"/>
        <path class="light-beam" d="M805 0h115l210 490H650Z" fill="url(#beam)" style="animation-delay:-2s"/>
        <g fill="#fff6cf" filter="url(#glow)">

        <!-- Maple court -->

            <!-- Body and jersey -->
            <g class="body-bob">

  <script>
    const scene = document.getElementById('trexScene');
    const toggle = document.getElementById('motionToggle');
    const restart = document.getElementById('restartButton');
    const pauseIcon = document.getElementById('pauseIcon');
    const playIcon = document.getElementById('playIcon');
    const label = document.getElementById('buttonLabel');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paused = false;

    function renderMotionState() {
      document.body.classList.toggle('paused', paused);
      if (paused) scene.pauseAnimations();
      else scene.unpauseAnimations();
      toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      label.textContent = paused ? '播放' : '暂停';
      pauseIcon.style.display = paused ? 'none' : '';
      playIcon.style.display = paused ? '' : 'none';
    }

    toggle.addEventListener('click', () => {
      paused = !paused;
      renderMotionState();
    });

    restart.addEventListener('click', () => {
      document.getAnimations().forEach(animation => { animation.currentTime = 0; });
      scene.setCurrentTime(0);
      if (paused) scene.pauseAnimations();
    });

    if (reducedMotion.matches) {
      paused = true;
      renderMotionState();
    }
  </script>
