<!DOCTYPE html>

<head>

<title>Pelican Riding a Bicycle</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #10263b;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  figure {
    margin: 0;
    padding: 16px;
    width: min(100vw, 150vh, 1100px);
    box-sizing: border-box;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
    cursor: pointer;
  }
  figcaption {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    color: #9fb6c9;
    font-size: 14px;
  }
  button {
    font: inherit;
    color: #10263b;
    background: #f4b62a;
    border: 0;
    border-radius: 999px;
    padding: 6px 16px;
    cursor: pointer;
  }
  button:focus-visible, svg:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* small ambient loops; everything mechanical is driven by the script */
  .glint { animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .1; } 50% { opacity: .75; } }

  .boat { animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }

  .eyelid { transform-box: fill-box; transform-origin: center top; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 96%, 98% { transform: scaleY(1); } }

  .whoosh { animation: whoosh 1.3s linear infinite; }
  @keyframes whoosh {
    0%   { transform: translateX(50px);  opacity: 0; }
    25%  { opacity: .55; }
    100% { transform: translateX(-90px); opacity: 0; }
  }

  .paused * { animation-play-state: paused !important; }
</style>
</head>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const svg = $('scene');

  // ── geometry ──────────────────────────────────────────────
  const WHEEL_R = 62;                 // outer tyre radius
  const WHEEL_T = 1.4;                // seconds per wheel turn
  const GEAR = 2;                     // chainring : cog
  const CRANK_T = WHEEL_T * GEAR;     // seconds per pedal turn
  const SPEED = 2 * Math.PI * WHEEL_R / WHEEL_T;   // road px / s
  const BB = { x: 368, y: 388 };      // bottom bracket
  const CRANK = 26;
  const THIGH = 68, SHIN = 76;
  const HIP_NEAR = { x: 356, y: 268 };
  const HIP_FAR  = { x: 363, y: 266 };

  // ── build spokes ──────────────────────────────────────────
  for (const id of ['spinR', 'spinF']) {
    const g = $(id);
    const N = 14;
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2;
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', (Math.cos(a) * 4).toFixed(2));
      l.setAttribute('y1', (Math.sin(a) * 4).toFixed(2));
      l.setAttribute('x2', (Math.cos(a) * 52).toFixed(2));
      l.setAttribute('y2', (Math.sin(a) * 52).toFixed(2));
      l.setAttribute('stroke', '#c3c9d2');
      l.setAttribute('stroke-width', '1');
      g.appendChild(l);
    }
    // a reflector and a valve so the spin reads clearly
    const refl = document.createElementNS(NS, 'rect');
    refl.setAttribute('x', 30); refl.setAttribute('y', -3);
    refl.setAttribute('width', 13); refl.setAttribute('height', 6);
    refl.setAttribute('rx', 2); refl.setAttribute('fill', '#ff7b39');
    g.appendChild(refl);
    const valve = document.createElementNS(NS, 'rect');
    valve.setAttribute('x', -51); valve.setAttribute('y', -1.2);
    valve.setAttribute('width', 8); valve.setAttribute('height', 2.4);
    valve.setAttribute('fill', '#2a2c35');
    g.appendChild(valve);
  }

  const layers = [...svg.querySelectorAll('.layer')].map(el => ({
    el,
    k: parseFloat(el.dataset.k),
    drift: parseFloat(el.dataset.drift || 0),
    w: parseFloat(el.dataset.w),
  }));

  const el = {
    spinR: $('spinR'), spinF: $('spinF'), ring: $('ring'), chain: $('chain'),
    pelican: $('pelican'), head: $('head'), tail: $('tail'), crest: $('crest'),
    pouch: $('pouchPath'), fish: $('fish'),
    scarfA: $('scarfA'), scarfB: $('scarfB'),
    near: { crank: $('crankNear'), pedal: $('pedalNear'), leg: $('legNear'), foot: $('footNear') },
    far:  { crank: $('crankFar'),  pedal: $('pedalFar'),  leg: $('legFar'),  foot: $('footFar')  },
  };

  const f = n => n.toFixed(2);

  // two-bone inverse kinematics: hip → knee → ankle resting on the pedal
  function leg(theta, hip, bob, parts) {
    const px = BB.x + CRANK * Math.cos(theta);
    const py = BB.y + CRANK * Math.sin(theta);
    parts.crank.setAttribute('x2', f(px));
    parts.crank.setAttribute('y2', f(py));
    parts.pedal.setAttribute('transform', `translate(${f(px)} ${f(py)})`);

    const ax = px - 5, ay = py - 7;
    const hx = hip.x, hy = hip.y + bob;
    const dx = ax - hx, dy = ay - hy;
    const d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.01);
    const a = Math.acos((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d));
    const phi = Math.atan2(dy, dx);
    const kx = hx + THIGH * Math.cos(phi - a);   // knee bends forward
    const ky = hy + THIGH * Math.sin(phi - a);
    parts.leg.setAttribute('d', `M${f(hx)} ${f(hy)} L${f(kx)} ${f(ky)} L${f(ax)} ${f(ay)}`);
    parts.foot.setAttribute('transform',
      `translate(${f(ax)} ${f(ay)}) rotate(${f(Math.sin(theta) * 9)})`);
  }

  function scarf(t, phase, len, lift) {
    const N = 14, ax = 397, ay = 205;
    let d = '';
    for (let i = 0; i <= N; i++) {
      const s = i / N;
      const x = ax - s * len;
      const y = ay - s * lift + Math.sin(s * 6.5 - t * 9 + phase) * (1 + s * 7);
      d += (i ? 'L' : 'M') + f(x) + ' ' + f(y);
    }
    return d;
  }

  function draw(t) {
    const dist = SPEED * t;
    for (const L of layers) {
      const off = (dist * L.k + t * L.drift) % L.w;
      L.el.setAttribute('transform', `translate(${f(-off)} 0)`);
    }

    const wheelDeg = (t / WHEEL_T * 360) % 360;
    el.spinR.setAttribute('transform', `rotate(${f(wheelDeg)})`);
    el.spinF.setAttribute('transform', `rotate(${f(wheelDeg)})`);

    const theta = t / CRANK_T * Math.PI * 2;
    el.ring.setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${f(theta * 180 / Math.PI % 360)})`);
    el.chain.setAttribute('stroke-dashoffset', f(-((theta * 16) % 5)));

    // the rider: a little bounce on every pedal stroke
    const bob = Math.sin(theta * 2) * 1.3;
    el.pelican.setAttribute('transform', `translate(0 ${f(bob)})`);
    el.head.setAttribute('transform', `rotate(${f(Math.sin(theta * 2 + 0.9) * 1.3)} 395 222)`);
    el.tail.setAttribute('transform', `rotate(${f(Math.sin(t * 8) * 3)} 302 250)`);
    el.crest.setAttribute('transform', `rotate(${f(Math.sin(t * 11) * 5)} 415 121)`);

    const sag = Math.sin(theta * 2 + 2) * 3.5;
    el.pouch.setAttribute('d',
      `M449 131 C452 ${f(172 + sag)} 505 ${f(182 + sag)} 541 156 Z`);

    el.scarfA.setAttribute('d', scarf(t, 0, 66, 9));
    el.scarfB.setAttribute('d', scarf(t, 1.4, 50, 2));

    el.fish.setAttribute('transform',
      `translate(492 240) rotate(${f(100 + Math.sin(t * 7) * 5)})`);

    leg(theta, HIP_NEAR, bob, el.near);
    leg(theta + Math.PI, HIP_FAR, bob, el.far);
  }

  // ── clock ─────────────────────────────────────────────────
  const btn = $('toggle');
  let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = 0.55, last = null;

  function tick(now) {
    if (!playing) return;
    if (last !== null) t += Math.min(0.05, (now - last) / 1000);
    last = now;
    draw(t);
    requestAnimationFrame(tick);
  }

  function setPlaying(p) {
    playing = p;
    svg.classList.toggle('paused', !p);
    btn.textContent = p ? 'Pause' : 'Play';
    btn.setAttribute('aria-pressed', String(!p));
    if (p) { last = null; requestAnimationFrame(tick); }
  }

  btn.addEventListener('click', () => setPlaying(!playing));
  svg.addEventListener('click', () => setPlaying(!playing));
  svg.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setPlaying(!playing); }
  });

  draw(t);
  setPlaying(playing);
})();
</script>
</body>
</html>
